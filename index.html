<style>
:root{--navy:#0b3a8c;--main:#1457d9;--bg:#eef3fb;--ink:#16202e;--mute:#64748b;--line:#d9e1ee;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#dfe7f4;color:var(--ink);font-family:"Noto Sans Devanagari","Segoe UI",Arial,sans-serif;line-height:1.5}
button{font:inherit;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.wrap.nb{padding-bottom:84px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px 20px;background:linear-gradient(135deg,var(--navy),var(--main));color:#fff;border-radius:0 0 24px 24px}
.hd h1{margin:0;font-size:19px;flex:1;text-align:center}.brand{font-size:26px!important;letter-spacing:3px}
.ib{width:38px;height:38px;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:50%;font-size:17px;display:grid;place-items:center}.ib.dim{opacity:.5}
.pg{padding:14px}
h3{margin:16px 2px 8px;font-size:16px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(20,40,80,.08);margin-bottom:12px}
.hello{display:flex;gap:12px;align-items:center}.hello small{color:var(--mute)}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:#dbe7ff;display:grid;place-items:center;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stats>div{display:flex;flex-direction:column;align-items:center;gap:4px}.stats small{color:var(--mute);font-size:11px;line-height:1.3}
.big{font-size:22px;font-weight:700;height:56px;display:grid;place-items:center}
.ring{--p:0;flex:none;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--main) calc(var(--p)*1%),#e2e8f0 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:6px;background:#fff;border-radius:50%}.ring b{position:relative;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles button{border:0;color:#fff;border-radius:14px;padding:12px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:98px}
.tiles span{font-size:22px}.tiles b{font-size:13px}.tiles small{font-size:11px;opacity:.92;line-height:1.2}
.act>div{display:grid;grid-template-columns:1fr auto;padding:8px 0;border-bottom:1px solid var(--line)}.act>div:last-child{border:0}
.act small{color:var(--mute);grid-column:1}.act em{grid-row:1/3;grid-column:2;color:var(--mute);font-size:12px;font-style:normal;align-self:center}
.cta{width:100%;border:2px dashed var(--c);color:var(--c);background:#fff;border-radius:14px;padding:12px;font-weight:700;margin-bottom:12px}.cta small{color:var(--mute);font-weight:400}
.sub{color:var(--mute);font-size:13px;margin:0 2px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(20,40,80,.08)}
.ic{flex:none;width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;font-size:20px;font-weight:700;display:grid;place-items:center}
.tx{flex:1;display:flex;flex-direction:column;min-width:0}.tx b{font-size:15px}.tx small{color:var(--mute);font-size:12px}
.bg{background:var(--c);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.row i{color:var(--mute);font-style:normal;font-size:22px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);margin-bottom:10px}
.bar{flex:1;height:8px;background:#dbe3f0;border-radius:8px;overflow:hidden}.bar div{height:100%;background:var(--main);transition:width .3s}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;max-height:96px;overflow-y:auto;position:relative;padding:3px}
.pb{width:34px;height:34px;font-weight:700;font-size:13px;border:2px solid var(--line);background:#fff;color:var(--mute);border-radius:8px}
.pb.ok{background:var(--ok);border-color:var(--ok);color:#fff}.pb.no{background:var(--bad);border-color:var(--bad);color:#fff}
.pb.cur{outline:3px solid var(--main);outline-offset:1px}.pb.rv{box-shadow:0 0 0 3px #f59e0b}
.legend{font-size:12px;color:var(--mute);margin:0 2px 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;color:#fff}
.tool{margin-left:auto;font-size:13px;font-weight:600;background:#fff;border:2px solid var(--line);color:var(--mute);border-radius:20px;padding:2px 12px}
.tool.on{background:#fff7e0;border-color:#f59e0b;color:#92400e}
.crumb{color:var(--mute);font-size:13px}.q{font-size:19px;font-weight:700;margin:4px 0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:#e8eefb;color:var(--navy);font-weight:700;display:grid;place-items:center}
.opt .t{flex:1}.opt .r{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #b6c2d6;display:grid;place-items:center;font-size:12px;color:#fff}
.opt{color:var(--ink)}.opt:hover:not(:disabled){border-color:var(--main)}.opt:disabled{cursor:default;color:var(--ink)}
.opt.pk .r{background:var(--main);border-color:var(--main)}.opt.pk .r::after{content:"•"}

.opt.wrong{background:var(--badbg);border-color:var(--bad)}.opt.wrong .r{background:var(--bad);border-color:var(--bad)}.opt.wrong .r::after{content:"✕"}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}.nav.res{flex-wrap:wrap;margin-top:14px}
.btn{flex:1;border:0;border-radius:12px;padding:12px 14px;font-weight:700;background:var(--main);color:#fff}

.q{margin:4px 0 10px}.tags{margin:0 0 12px}
.pol h4{margin:14px 0 4px;color:var(--navy)}.pol p{margin:0;font-size:14px}
.cs small{display:block;color:var(--mute);margin-top:-6px;margin-bottom:8px}

function hdr(l,r,t){const f=t.replace(/<[^>]*>/g,"").length>30?' style="font-size:15px"':"";return `<header class="hd">${l||'<span class="ib"></span>'}<h1${f}>${t}</h1>${r||'<span class="ib"></span>'}</header>`}
function view(html,tab,keep,bf){
  app.className="wrap"+(tab?" nb":"");
  app.innerHTML=html+(tab?`<nav class="bn">${TABS.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="goTab('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("")}</nav>`:"");
  if(!keep)window.scrollTo(0,0);
  if(bf){const b=document.getElementById("bk");if(b)b.onclick=bf}
}
function goTab(k){clearInterval(tick);({home:home,pyq:pyqSubjects,tests:tests,mist:mistakes,prof:profile})[k]()}
/* एक पंक्ति (row): o = {c रंग, i आइकन, raw (SVG हो तो), t, s, b बैज, soon, on क्लिक, href, ext} */
function R(o){
  const inner=`<span class="ic${o.raw?" raw":""}">${o.i}</span><span class="tx"><b>${o.t}</b><small>${o.s||""}</small></span>${o.b?`<span class="bg${o.soon?" soon":""}">${o.b}</span>`:""}<i>›</i>`;
  return o.href?`<a class="row" style="--c:${o.c}" href="${o.href}"${o.ext?' target="_blank" rel="noopener"':""}>${inner}</a>`:`<button class="row" style="--c:${o.c}" onclick="${o.on}">${inner}</button>`;
}
function comingSoon(t,bf,tab,sub){
  clearInterval(tick);
  view(hdr(BACK,"",t)+`<main class="pg"><div class="card cs"><div class="csi">🚧</div><h2>Coming Soon</h2>${sub?`<small>${sub}</small>`:""}<p><b>${t}</b> का कंटेंट जल्द ही जोड़ा जाएगा।<br>थोड़ा इंतज़ार कीजिए — हम तैयारी में हैं!</p><button class="btn" id="csb">← वापस जाएँ</button></div></main>`,tab,false,bf);
  document.getElementById("csb").onclick=bf;
}

function pyqChapters(si){

/* ---------- शुरू करना: Practice सीधा, Test पहले निर्देश ---------- */
function startSet(keys,l){ret=mistakes;const s=new Set(keys||[]);start(q=>s.has(q.question),l,0,"practice")}
function start(f,l,n,m){
  mode=m||"practice";Q=QS.filter(f);if(n)Q=Q.sort(()=>Math.random()-.5).slice(0,n);
  if(!Q.length)return toast("अभी इसमें कोई प्रश्न नहीं है");
  label=l||"PYQ अभ्यास";
  if(mode==="test")intro();else begin();
}
function begin(){finished=false;state=Q.map(()=>({picked:null,time:0,review:false}));cur=0;render()}
function intro(){
  view(hdr(BACK,"","टेस्ट निर्देश")+`<main class="pg"><div class="card"><h2 style="margin:0;font-size:19px">${label}</h2><div class="sub" style="margin:0 0 12px">Test Mode</div>
  <ul class="ins"><li>कुल प्रश्न: <b>${Q.length}</b></li><li>हर सही उत्तर: <b style="color:var(--ok)">+1 अंक</b></li>
  <li>हर गलत उत्तर: <b style="color:var(--bad)">−1/3 अंक</b> (नेगेटिव मार्किंग)</li><li>उत्तर न देने पर: <b>0 अंक</b></li>
  <li>टेस्ट के दौरान सही उत्तर नहीं दिखेगा। सबमिट के बाद ही रिज़ल्ट, सही उत्तर और व्याख्या दिखेंगे।</li>
  <li>सबमिट से पहले आप उत्तर बदल या हटा सकते हैं और प्रश्नों को 🚩 रिव्यू में रख सकते हैं।</li>
  <li>सबमिट आखिरी प्रश्न पर दिखेगा। सबमिट के बाद उत्तर बदले नहीं जा सकेंगे।</li></ul>
  <label class="chk"><input type="checkbox" id="agree"> मैंने सभी निर्देश पढ़ लिए हैं</label>
  <button class="btn" style="width:100%;margin-top:12px" id="go" disabled>टेस्ट शुरू करें →</button></div></main>`,"",false,ret||home);
  const cb=document.getElementById("agree"),g=document.getElementById("go");
  cb.onchange=()=>{g.disabled=!cb.checked};g.onclick=begin;
}
function startTimer(){clearInterval(tick);startTime=Date.now();const base=state[cur].time;
  tick=setInterval(()=>{const el=document.getElementById("timer");if(el)el.textContent=fmt(base+Math.floor((Date.now()-startTime)/1000))},500)}
function stopTimer(){clearInterval(tick);state[cur].time+=Math.round((Date.now()-startTime)/1000)}
const stopped=()=>finished||(mode==="practice"&&state[cur].picked!==null);

/* ---------- क्विज़: QUESTION → EXAM NAME → OPTIONS ---------- */
function render(keep){
  const q=Q[cur],st=state[cur],test=mode==="test",done=st.picked!==null,show=finished||(!test&&done),last=cur===Q.length-1;
  const answered=state.filter(s=>s.picked!==null).length,sv=new Set(store.get("pyq_saved")).has(q.question),hide=test&&!finished;
  view(hdr(BACK,`<button class="ib ${sv?"":"dim"}" id="sv">🔖</button>`,`${label}<br><small style="font-weight:400;font-size:11px;opacity:.85">${test?"Test Mode":"Practice Mode"}</small>`)+`<main class="pg">
  <div class="prog"><span>⏱ <b id="timer">${fmt(st.time)}</b></span><div class="bar"><div style="width:${answered/Q.length*100}%"></div></div><span><b>${cur+1}</b> / ${Q.length}</span></div>
  <div class="pal" id="pal">${Q.map((qq,i)=>{const s=state[i];let c=(i===cur?"cur ":"")+(s.review?"rv ":"");if(s.picked!==null)c+=hide?"an":(s.picked===qq.answer?"ok":"no");return `<button class="pb ${c}" data-n="${i}">${i+1}</button>`}).join("")}</div>
  <div class="legend">${hide?"🟦 उत्तर दिया &nbsp; ⬜ बाकी &nbsp; 🟧 रिव्यू":"🟩 सही &nbsp; 🟥 गलत &nbsp; ⬜ बाकी &nbsp; 🟧 रिव्यू"}</div>
  <div class="card"><div class="tools"><button class="tool ${st.review?"on":""}" id="rv">🚩 रिव्यू</button>${hide&&done?'<button class="tool" id="clr">✖ हटाएँ</button>':""}</div>
  <div class="crumb">${q.subject} › ${q.chapter}</div>
  <p class="q">${q.question}</p>
  <div class="tags">${q.exams.map(e=>`<span class="tag" style="background:${colorFor(e)}">${e}</span>`).join("")}</div>
  ${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="l">${"ABCD"[i]}</span><span class="t">${o}</span><span class="r"></span></button>`).join("")}
  <div class="exp" id="exp"><h4>सही उत्तर</h4><b>${"ABCD"[q.answer]}. ${q.options[q.answer]}</b><p>${q.explanation}</p></div></div>
  <div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>← पिछला</button>
  <button class="btn" id="next">${last?(finished?"रिज़ल्ट पर लौटें":"✔ सबमिट करें"):"अगला →"}</button></div><div id="askbox"></div></main>`,"",keep);
  const pal=document.getElementById("pal");pal.querySelectorAll(".pb").forEach(x=>x.onclick=()=>go(+x.dataset.n));
  const cb=pal.querySelector(".cur");if(cb)pal.scrollTop=Math.max(0,cb.offsetTop-40);
  const btns=app.querySelectorAll(".opt");btns.forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  btns.forEach((b,i)=>{if(i===st.picked)b.classList.add("pk");
    if(show){b.disabled=true;if(i===q.answer)b.classList.add("correct");else if(i===st.picked)b.classList.add("wrong")}});
  if(show)document.getElementById("exp").style.display="block";else startTimer();
  document.getElementById("prev").onclick=()=>go(cur-1);
  document.getElementById("next").onclick=()=>last?(finished?result():trySubmit()):go(cur+1);
  const rv=document.getElementById("rv"),sb=document.getElementById("sv"),clr=document.getElementById("clr");
  rv.onclick=()=>{st.review=!st.review;rv.classList.toggle("on",st.review);const c=document.querySelector(".pb.cur");if(c)c.classList.toggle("rv",st.review);
    const rs=new Set(store.get("jk_review"));if(st.review)rs.add(q.question);else rs.delete(q.question);store.set("jk_review",[...rs])};
  if(clr)clr.onclick=()=>{stopTimer();st.picked=null;render(true)};
  sb.onclick=()=>{const s=new Set(store.get("pyq_saved"));if(s.has(q.question))s.delete(q.question);else s.add(q.question);
    store.set("pyq_saved",[...s]);sb.classList.toggle("dim",!s.has(q.question));toast(s.has(q.question)?"सेव किया":"सेव हटाया")};
  document.getElementById("bk").onclick=()=>finished?result():ask("टेस्ट बीच में छोड़ें? इसका रिज़ल्ट सेव नहीं होगा।","जारी रखें","हाँ, छोड़ें",ret||home);
}
function ask(msg,no,yes,fn){
  const box=document.getElementById("askbox");
  box.innerHTML=`<div class="card" style="margin-top:12px;border:2px solid #f59e0b"><b>${msg}</b><div class="nav" style="margin-top:12px"><button class="btn ghost" id="askno">${no}</button><button class="btn" id="askyes">${yes}</button></div></div>`;
  document.getElementById("askno").onclick=()=>{box.innerHTML=""};
  document.getElementById("askyes").onclick=fn;
  box.scrollIntoView({behavior:"smooth",block:"center"});
}
function trySubmit(){
  const left=state.filter(s=>s.picked===null).length,rv=state.filter(s=>s.review).length;
  if(!left&&!rv)return finish();
  ask([left?left+" प्रश्न बाकी हैं":"",rv?rv+" प्रश्न रिव्यू में हैं":""].filter(Boolean).join(" और ")+"। फिर भी सबमिट करें?","नहीं, वापस जाएँ","हाँ, सबमिट करें",finish);
}
function pick(i){if(finished)return;if(mode==="practice"&&state[cur].picked!==null)return;stopTimer();state[cur].picked=i;render(true)}
function go(n){if(!stopped())stopTimer();cur=n;render()}

function finish(){
  if(!stopped())stopTimer();
  clearInterval(tick);finished=true;
  let r=0,w=0,s=0,t=0;
  state.forEach((x,i)=>{t+=x.time;if(x.picked===null)s++;else if(x.picked===Q[i].answer)r++;else w++});
  const ws=new Set(store.get("pyq_wrong")),ds=new Set(store.get("jk_done"));
  state.forEach((x,i)=>{if(x.picked===null)return;ds.add(Q[i].question);if(x.picked===Q[i].answer)ws.delete(Q[i].question);else ws.add(Q[i].question)});
  store.set("pyq_wrong",[...ws]);store.set("jk_done",[...ds]);
  const sc=mode==="test"?+(r-w*NEG).toFixed(2):r;
  const H=store.get("jk_hist");H.unshift({n:label,r:r,w:w,s:s,m:mode,sc:sc,ts:Date.now()});store.set("jk_hist",H.slice(0,30));
  const D=new Set(store.get("jk_days"));D.add(day(new Date()));store.set("jk_days",[...D].slice(-400));
  window.__w=Q.filter((q,i)=>state[i].picked!==null&&state[i].picked!==q.answer).map(q=>q.question);
  window.__r=Q.filter((q,i)=>state[i].review).map(q=>q.question);
  RS={r:r,w:w,s:s,t:t,sc:sc};result();
}
function result(){
  const r=RS.r,w=RS.w,s=RS.s,t=RS.t,sc=RS.sc,n=Q.length,test=mode==="test",pc=Math.max(0,Math.round(sc/n*100));
  view(hdr("","","आपका रिज़ल्ट")+`<main class="pg"><div class="card"><div class="score"><span class="ring" style="--p:${pc}"><b>${pc}%</b></span><div><b>${test?sc+" / "+n+" अंक":r+" / "+n+" सही"}</b><br><small style="color:var(--mute)">${label} · ${test?"Test Mode":"Practice Mode"}</small></div></div>
  <div class="stat"><div><b style="color:var(--ok)">${r}</b>सही</div><div><b style="color:var(--bad)">${w}</b>गलत</div><div><b>${s}</b>छोड़े</div></div>
  ${test?`<p class="legend" style="margin:-4px 0 10px">अंक = ${r} − (${w} × 1/3) = ${sc}</p>`:""}
  <p style="margin:0 0 10px">कुल समय: <b>${fmt(t)}</b> | औसत प्रति प्रश्न: <b>${fmt(Math.round(t/n))}</b></p>
  <table><tr><th>प्रश्न</th><th>नतीजा</th><th>समय</th></tr>${state.map((x,i)=>`<tr onclick="cur=${i};render()" style="cursor:pointer"><td>${i+1}</td><td>${x.picked===null?"छोड़ा":x.picked===Q[i].answer?"✅ सही":"❌ गलत"}</td><td>${fmt(x.time)}</td></tr>`).join("")}</table>
  <p class="legend" style="margin-top:8px">किसी भी पंक्ति पर टैप करें — वही प्रश्न सही उत्तर और व्याख्या के साथ खुलेगा।</p>
  <div class="nav res"><button class="btn ghost" onclick="cur=0;render()">📖 सारे उत्तर देखें</button>
  <button class="btn ghost" onclick="startSet(window.__w,'गलत प्रश्न')" ${window.__w.length?"":"disabled"}>❌ गलत (${window.__w.length})</button>
  <button class="btn ghost" onclick="startSet(window.__r,'रिव्यू वाले प्रश्न')" ${window.__r.length?"":"disabled"}>🚩 रिव्यू (${window.__r.length})</button>
  <button class="btn" onclick="home()">🏠 होम</button></div></div></main>`);
}

splash();
</script>
</body>
</html>
