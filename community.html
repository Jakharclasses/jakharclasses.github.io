.cmnt .cmcrm small{white-space:normal}.cmud{width:10px;height:10px;border-radius:50%;background:transparent;flex:none}.cmnt.un{background:var(--soft)}.cmnt.un .cmud{background:var(--main)}
.cmnav button,#cmBl{position:relative}.cmdot{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font:700 10px/16px Inter,sans-serif;text-align:center;padding:0 4px;font-style:normal}#cmBl .cmdot{top:-2px;left:auto;right:-2px}
.cmsg{padding:6px 4px;align-items:center}.cmsg .cmcr{padding:0}

.cmsoon .ic{width:40px;height:40px;color:var(--main)}.cmsoon b{color:var(--ink);font-size:17px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div id="app" class="wrap"></div>
<script>
/* ===== JAKHAR Community (standalone) — Part 1 shell =====
   Study App (index.html) se kuch badla nahi gaya. Yahan host ke wahi globals ki chhoti copy hai jo community.js maangta hai:
   SM_BASE, SM_KEY, smE, toast, hdr, BACK, view, seeMore, profile, CONTACT, DONATE, JKAuth, JKProfile.
   Session wahi `jkx_auth` (localStorage) hai, isliye login Study App se hi hota hai. */
const SM_BASE="https://gpqrkxyypadgvguomfrr.supabase.co",SM_KEY="sb_publishable_WIDLgN0x4IX2_LYy2WBWCA_3-zLJvrq";
const CONTACT={yt:"https://youtube.com/@vinodkumarnath007",tg:"https://t.me/vinodkumarnath007",mail:"nvinu2259@gmail.com"};
const DONATE={upi:"vinodnath@ptyes",name:"",qr:""};
const COMM_V="8";   /* community.js ka version — index.html ke JK_COMM_V jaisa; community.js badle to dono badlo */
const smE=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
try{const th=JSON.parse(localStorage.getItem("jk_theme")||"[]");document.documentElement.classList.toggle("dark",th[0]==="dark")}catch(e){}

/* ---- JKAuth (sirf wahi jo Community ko chahiye; code index.html se) ---- */
window.JKAuth=(function(){
  function load(){try{return JSON.parse(localStorage.getItem("jkx_auth")||"null")}catch(e){return null}}
  function save(s){try{if(s)localStorage.setItem("jkx_auth",JSON.stringify(s));else localStorage.removeItem("jkx_auth")}catch(e){}}
  async function call(path,body){
    let r;
    for(let t=0;t<2;t++){
      const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);
      try{r=await fetch(SM_BASE+path,{method:"POST",headers:{apikey:SM_KEY,"Content-Type":"application/json"},body:JSON.stringify(body),signal:ac.signal});break}
      catch(e){if(t===1)throw new Error("Failed to fetch")}
      finally{clearTimeout(tm)}
    }
    const j=await r.json().catch(()=>null);
    if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description||j.error))||("HTTP "+r.status));
    return j;
  }
  const pack=j=>({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||"",uid:(j.user&&j.user.id)||""});
  let RP=null;function refresh(){return RP||(RP=refreshOnce().finally(()=>{RP=null}))}
  async function refreshOnce(){
    const s=load();if(!s||!s.refresh_token)return;
    if(s.expires_at-60>Date.now()/1000)return;
    try{save(pack(await call("/auth/v1/token?grant_type=refresh_token",{refresh_token:s.refresh_token})))}
    catch(e){if(/invalid|expired|not found|revoked/i.test(e.message))save(null)}
  }
  async function ensureUid(){
    try{
      await refresh();const s=load();if(!s)return "";
      if(s.uid)return s.uid;
      const r=await fetch(SM_BASE+"/auth/v1/user",{headers:{apikey:SM_KEY,Authorization:"Bearer "+s.access_token}});
      const u=await r.json().catch(()=>null);if(!r.ok||!u)throw new Error("HTTP "+r.status);
      s.uid=u.id||"";if(u.email)s.email=u.email;save(s);return s.uid;
    }catch(e){return ""}
  }
  return {getSession:load,isLoggedIn:()=>!!load(),uid:()=>(load()||{}).uid||"",ensureUid,refresh};
})();

/* ---- JKProfile (sirf get/load/avatar; `profiles` table, cache key jk_profile — index.html ke saath same) ---- */
window.JKProfile=(function(){
  const CK="jk_profile",DEF_NAME="JAKHAR विद्यार्थी";
  const cache=()=>{try{return JSON.parse(localStorage.getItem(CK)||"null")}catch(e){return null}};
  const setCache=p=>{try{if(p)localStorage.setItem(CK,JSON.stringify(p));else localStorage.removeItem(CK)}catch(e){}};
  function get(){const p=cache(),u=JKAuth.uid();return p&&u&&p.id===u?p:null}
  async function tok(){
    try{await JKAuth.refresh()}catch(e){}
    let s=JKAuth.getSession();if(!s)return null;
    if(!s.uid){await JKAuth.ensureUid();s=JKAuth.getSession()}
    return s&&s.uid?s:null;
  }
  async function rest(method,path,s,body,extra){
    const h={apikey:SM_KEY,Authorization:"Bearer "+s.access_token,"Content-Type":"application/json"};if(extra)Object.assign(h,extra);
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);let r;
    try{r=await fetch(SM_BASE+path,{method,headers:h,body:body==null?undefined:JSON.stringify(body),signal:ac.signal})}
    catch(e){throw new Error("NET")}finally{clearTimeout(tm)}
    const j=await r.json().catch(()=>null);
    if(!r.ok){const e=new Error((j&&(j.message||j.msg||j.error))||("HTTP "+r.status));e.code=j&&j.code;e.status=r.status;throw e}
    return j;
  }
  let LP=null;
  function load(){return LP||(LP=loadOnce().finally(()=>{LP=null}))}
  async function loadOnce(){
    const s=await tok();if(!s)return null;
    const a=await rest("GET","/rest/v1/profiles?id=eq."+s.uid+"&select=*",s);
    if(a&&a[0]){setCache(a[0]);return a[0]}
    return create(s);
  }
  async function create(s){
    for(let t=0;t<6;t++){
      const un="jakhar"+String(Math.floor(Math.random()*1e6)).padStart(6,"0");
      try{const r=await rest("POST","/rest/v1/profiles",s,{id:s.uid,username:un,display_name:DEF_NAME},{Prefer:"return=representation"});if(r&&r[0]){setCache(r[0]);return r[0]}}
      catch(e){
        if(e.code==="23505"||e.status===409){const a=await rest("GET","/rest/v1/profiles?id=eq."+s.uid+"&select=*",s).catch(()=>null);if(a&&a[0]){setCache(a[0]);return a[0]}continue}
        throw e}
    }
    return null;
  }
  const COL=["#1457d9","#c2410c","#0f766e","#7e22ce","#be185d","#4d7c0f","#b45309","#0369a1"];
  function colorOf(u){let h=0;String(u||"").split("").forEach(c=>{h=(h*31+c.charCodeAt(0))>>>0});return COL[h%COL.length]}
  function avatar(p,big){
    const cls="pfa"+(big?" big":"");
    if(p&&p.avatar_url)return'<img class="'+cls+'" src="'+smE(p.avatar_url)+'" alt="">';
    const n=Array.from(String((p&&p.display_name)||"J").trim())[0]||"J";
    return'<span class="'+cls+'" style="background:'+colorOf(p&&p.username)+'">'+smE(n.toUpperCase())+'</span>';
  }
  return {get,load,avatar};
})();

/* ---- Screen shell: view/hdr/BACK + hash navigation (#feed, #groups, #g/<id>/<tab>) ---- */
const app=document.getElementById("app");
const BACK='<button class="ib" id="bk" aria-label="वापस"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M20 12H5M11.5 5.5L5 12l6.5 6.5"/></svg></button>';
function hdr(l,r,t){const f=t.replace(/<[^>]*>/g,"").length>30?' style="font-size:15px"':"";return `<header class="hd">${l||'<span class="ib"></span>'}<h1${f}>${t}</h1>${r||'<span class="ib"></span>'}</header>`}
function seeMore(){location.href="index.html#home"}   /* community.js ka "bahar jao" back */
function profile(){location.href="index.html#home"}   /* Donate screen ka back (Study App me hi use hota hai) */
function toLogin(){
  if(window.JK_DEV)return;
  try{localStorage.setItem("jk_after_login",JSON.stringify({u:"community.html"+(location.hash||""),t:Date.now()}))}catch(e){}
  document.documentElement.style.display="none";location.replace("index.html#login");
}
let curBack=null,prevTitle=null,navBack=false,depth=0,lastGid="";
/* community.js group kholte hi `groups?id=eq.<id>&select=*` GET karta hai; usse group id pakad kar URL hash me rakhte hain
   (community.js ko chhue bina). Part 4 me ise sahi router se badalna hai. */
const _fetch=window.fetch.bind(window);
window.fetch=function(u,o){try{const m=/\/rest\/v1\/groups\?id=eq\.([\w-]+)&select=\*/.exec(String(u));if(m)lastGid=m[1]}catch(e){}return _fetch(u,o)};
function hashOf(){
  const on=app.querySelector(".cmtabs button.on");if(!on)return "";
  const k=on.dataset.t;
  if(app.querySelector(".cmnav"))return "#"+k;                                    /* hub: feed|chats|groups|notif|profile */
  if(lastGid&&(k==="chat"||k==="posts"||k==="info"))return "#g/"+lastGid+"/"+k;  /* group */
  return "";
}
function goBack(){
  if(depth>0)history.back();
  else if(typeof curBack==="function"){navBack=true;curBack()}
}
function view(html,tab,keep,bf){
  if(!JKAuth.isLoggedIn()&&!window.JK_DEV){toLogin();return}
  app.className="wrap";app.innerHTML=html;
  if(!keep)window.scrollTo(0,0);
  const h1=app.querySelector(".hd h1"),title=h1?h1.textContent:"";
  const url=location.pathname+location.search+(hashOf()||location.hash);
  try{
    if(prevTitle===null||navBack||title===prevTitle)history.replaceState({d:depth},"",url);
    else{depth++;history.pushState({d:depth},"",url)}
  }catch(e){}
  prevTitle=title;navBack=false;curBack=bf||null;
  const b=document.getElementById("bk");if(b)b.onclick=goBack;
}
window.addEventListener("popstate",e=>{
  const nd=(e.state&&e.state.d)||0,fwd=nd>depth;depth=nd;
  if(!e.state||fwd){restore();return}           /* hash haath se badla / Forward: hash se screen banao */
  if(typeof curBack==="function"){navBack=true;curBack()}
});
window.addEventListener("storage",e=>{if(e.key==="jkx_auth"&&!e.newValue)toLogin()});   /* Study App me logout hua */

/* ---- Load community.js, phir hash se screen restore ---- */
function loadComm(){
  if(window.JKCom)return Promise.resolve(window.JKCom);
  return new Promise((ok,no)=>{
    const sc=document.createElement("script");sc.src="community.js?v="+COMM_V;
    sc.onload=()=>window.JKCom?ok(window.JKCom):no(new Error("LOAD"));
    sc.onerror=()=>no(new Error("NET"));
    document.head.appendChild(sc);
  });
}
async function restore(){
  navBack=true;
  const h=location.hash,g=/^#g\/([\w-]+)(?:\/(chat|posts|info))?$/.exec(h);
  await JKCom.open();
  if(!JKAuth.isLoggedIn()&&!window.JK_DEV){toLogin();return}
  if(g)JKCom.openGroup(g[1],g[2]||"chat");
  else{const m=/^#(chats|groups|notif|profile)$/.exec(h);if(m){const b=app.querySelector('.cmnav button[data-t="'+m[1]+'"]');if(b)b.click()}}
}
function askLang(){
  if(JKLang.has())return Promise.resolve();
  return new Promise(ok=>{const d=document.createElement("div");d.className="mdl";
    d.innerHTML='<div class="card" style="text-align:center"><h2>Choose your language<br>अपनी भाषा चुनें</h2><p>You can change it later in Settings.<br>बाद में Settings में बदल सकते हैं।</p><div style="display:flex;gap:10px"><button class="btn" data-l="hi">हिन्दी</button><button class="btn ghost" data-l="en">English</button></div></div>';
    d.onclick=e=>{const b=e.target.closest("[data-l]");if(!b)return;JKLang.set(b.dataset.l);d.remove();ok()};document.body.appendChild(d)});
}
function loadJs(src){return new Promise((ok,no)=>{const m=document.createElement("script");m.src=src;m.onload=ok;m.onerror=no;document.head.appendChild(m)})}
async function boot(){
  if(!JKAuth.isLoggedIn()&&!window.JK_DEV){toLogin();return}
  await askLang();
  JKAuth.ensureUid();
  app.className="wrap";
  app.innerHTML=hdr("","","Student Community")+'<main class="pg"><div class="card" style="text-align:center;color:var(--mute)">लोड हो रही है...</div></main>';
  try{history.replaceState(null,"",location.pathname+location.hash)}catch(e){}   /* ?join=... URL se hatao (code sessionStorage me hai) */
  if(!window.JKI18N){try{await loadJs("community-i18n.js")}catch(e){}}
  if(window.JKI18N)JKI18N.start();
  if(window.JK_MOCK&&!window.JK_MOCKED){try{await loadJs("community-mock.js")}catch(e){}}
  try{await loadComm()}
  catch(e){
    app.innerHTML=hdr(BACK,"","Student Community")+'<main class="pg"><div class="card" style="text-align:center">Community अभी खुल नहीं पा रही।<br>इंटरनेट जाँचकर फिर कोशिश करें।<br><br><button class="btn" id="cmR" style="width:100%">फिर कोशिश करें</button></div></main>';
    document.getElementById("bk").onclick=seeMore;document.getElementById("cmR").onclick=()=>location.reload();return;
  }
  await restore();
  let code="";try{code=sessionStorage.getItem("jk_join")||""}catch(e){}
  if(code&&JKAuth.isLoggedIn())JKCom.handleJoin(code);
}
boot();
</script>
