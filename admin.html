<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAKHAR Admin</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e3e6ea;--pri:#2b5cff;--bad:#c62828;--ok:#2e7d32}
  @media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2125;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2c3238;--pri:#6c8cff;--bad:#ef6b6b;--ok:#6fcf74}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
  h1{font-size:20px;margin:6px 0 12px}
  input,select,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
  input,textarea{margin-bottom:10px}
  textarea{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
  button{background:var(--pri);color:#fff;border:0;font-weight:600;cursor:pointer}
  button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);width:auto}
  .row{display:flex;gap:8px;align-items:center}
  .msg{color:var(--bad);font-size:14px;min-height:20px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mut);margin:8px 0}
  .stats b{color:var(--tx)}
  .q{font-weight:600;margin-bottom:4px}
  .meta{font-size:12px;color:var(--mut)}
  .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);margin-right:4px}
  .hid{color:var(--bad);border-color:var(--bad)}
  .on{color:var(--ok);border-color:var(--ok)}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>JAKHAR Admin Panel</h1>

  <!-- LOGIN -->
  <div id="loginBox" class="card">
    <input id="em" type="email" placeholder="Admin email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Login</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- PANEL -->
  <div id="panel" class="hide">
    <div class="row" style="margin-bottom:8px">
      <div id="who" class="meta" style="flex:1"></div>
      <button class="sec" id="backupBtn" style="margin-right:6px">⬇️ Backup</button><button class="sec" id="logoutBtn">Logout</button>
    </div>
    <div id="adminState" class="card"></div>
    <div class="card">
      <button class="sec" id="toggleAdd" style="width:100%">+ Naya sawal jodo</button>
      <div id="addBox" class="hide" style="margin-top:12px">
        <select id="aSub" style="margin-bottom:10px"></select>
        <select id="aChap" style="margin-bottom:10px"></select>
        <textarea id="aQ" rows="3" placeholder="Sawal"></textarea>
        <input id="aO0" placeholder="Option 1"><input id="aO1" placeholder="Option 2">
        <input id="aO2" placeholder="Option 3"><input id="aO3" placeholder="Option 4">
        <select id="aAns" style="margin-bottom:10px">
          <option value="0">Sahi jawab: Option 1</option><option value="1">Sahi jawab: Option 2</option>
          <option value="2">Sahi jawab: Option 3</option><option value="3">Sahi jawab: Option 4</option>
        </select>
        <textarea id="aExp" rows="3" placeholder="Explanation"></textarea>
        <input id="aEx" placeholder="Exams (comma se alag), jaise: RPSC RAS 2021, Patwari 2021">
        <label style="display:block;margin-bottom:10px;font-size:14px"><input id="aAct" type="checkbox" style="width:auto;margin:0 6px 0 0"> Turant active karo (live app me dikhe)</label>
        <button id="saveAdd">Save sawal</button>
        <div id="addMsg" class="msg"></div>
      </div>
    </div>
    <div class="card">
      <button class="sec" id="toggleBulk" style="width:100%">📥 Ek saath kai sawal jodo (CSV)</button>
      <div id="bulkBox" class="hide" style="margin-top:12px">
        <div class="meta" style="margin-bottom:8px">Sheets/Excel me sawal likho (columns: subject, chapter, question, option1, option2, option3, option4, answer, explanation, exams), "CSV" me save karke yahan chuno. Answer 1-4 ya A-D likho. Pehle template download kar lo.</div>
        <button class="sec" id="tplBtn" style="margin-bottom:10px">Template download karo</button>
        <input id="bkFile" type="file" accept=".csv,.txt,text/csv,text/plain">
        <textarea id="bkText" rows="4" placeholder="Ya yahan CSV text paste karo"></textarea>
        <label style="display:block;margin-bottom:10px;font-size:14px"><input id="bkAct" type="checkbox" checked style="width:auto;margin:0 6px 0 0"> Import ke baad turant active karo (live app me dikhe)</label>
        <div class="row"><button id="bkCheck" class="sec">1. Jaanch karo</button><button id="bkGo" disabled>2. Import karo</button></div>
        <div id="bkMsg" class="msg" style="white-space:pre-wrap"></div>
      </div>
    </div>
    <input id="search" type="search" placeholder="Sawal / subject / chapter me khojo...">
    <select id="statusF" style="margin-bottom:8px">
      <option value="all">Sab (active + hidden)</option>
      <option value="active">Sirf active</option>
      <option value="hidden">Sirf hidden</option>
    </select>
    <div id="stats" class="stats"></div>
    <div id="list"></div>
    <div id="more" class="meta" style="text-align:center;padding:8px"></div>
  </div>
</div>

<script>
const SB_URL = "https://gpqrkxyypadgvguomfrr.supabase.co";
const SB_KEY = "sb_publishable_WIDLgN0x4IX2_LYy2WBWCA_3-zLJvrq"; // publishable key (public hai)
let TOKEN = null, ALL = [], USER = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path, opts = {}) {
  const r = await fetch(SB_URL + path, {
    ...opts,
    headers: { apikey: SB_KEY, Authorization: "Bearer " + (TOKEN || SB_KEY), "Content-Type": "application/json", ...(opts.headers || {}) }
  });
  const txt = await r.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) throw new Error((j && (j.msg || j.message || j.error_description || j.error)) || ("HTTP " + r.status));
  return j;
}

async function login() {
  $("loginMsg").textContent = "";
  const email = $("em").value.trim(), password = $("pw").value;
  if (!email || !password) { $("loginMsg").textContent = "Email aur password dono daalo."; return; }
  $("loginBtn").disabled = true;
  try {
    const j = await api("/auth/v1/token?grant_type=password", { method: "POST", body: JSON.stringify({ email, password }) });
    TOKEN = j.access_token; USER = j.user;
    $("pw").value = "";
    await openPanel();
  } catch (e) {
    $("loginMsg").textContent = "Login fail: " + e.message;
  }
  $("loginBtn").disabled = false;
}

function logout() {
  TOKEN = null; USER = null; ALL = [];
  $("panel").classList.add("hide");
  $("loginBox").classList.remove("hide");
}

async function openPanel() {
  $("loginBox").classList.add("hide");
  $("panel").classList.remove("hide");
  $("who").textContent = "Login: " + (USER && USER.email || "");
  // admin check (is_admin() function)
  let isAdmin = false;
  try { isAdmin = await api("/rest/v1/rpc/is_admin", { method: "POST", body: "{}" }); } catch (e) {}
  $("adminState").innerHTML = isAdmin
    ? '<span class="tag on">ADMIN OK</span> Aap admin hain.'
    : '<span class="tag hid">ADMIN NAHI</span> Ye user admins table me nahi hai (sirf active sawal dikhenge).';
  await loadQuestions();
}

async function loadQuestions() {
  $("list").innerHTML = '<div class="meta">Load ho raha hai...</div>';
  try {
    ALL = await api("/rest/v1/questions?select=id,subject,chapter,question,options,answer,explanation,exams,is_active,created_at&order=created_at.desc&limit=1000");
    render(); fillSubjects();
  } catch (e) {
    $("list").innerHTML = '<div class="msg">Load error: ' + esc(e.message) + '</div>';
  }
}

function render() {
  const t = $("search").value.trim().toLowerCase(), f = $("statusF").value;
  const rows = ALL.filter(q => {
    if (f === "active" && !q.is_active) return false;
    if (f === "hidden" && q.is_active) return false;
    if (!t) return true;
    return (q.question + " " + q.subject + " " + q.chapter).toLowerCase().includes(t);
  });
  const act = ALL.filter(q => q.is_active).length;
  $("stats").innerHTML = '<span>Total: <b>' + ALL.length + '</b></span><span>Active: <b>' + act +
    '</b></span><span>Hidden: <b>' + (ALL.length - act) + '</b></span><span>Dikh rahe: <b>' + rows.length + '</b></span>';
  const SHOW = 50;
  $("list").innerHTML = rows.slice(0, SHOW).map(q =>
    '<div class="card"><div class="q">' + esc(q.question) + '</div>' +
    '<div class="meta">' + esc(q.subject) + ' › ' + esc(q.chapter) + '</div>' +
    '<div style="margin-top:6px"><span class="tag ' + (q.is_active ? "on" : "hid") + '">' + (q.is_active ? "active" : "hidden") + '</span>' +
    '<span class="meta">Ans: ' + esc((q.options || [])[q.answer]) + '</span></div>' +
    '<div class="row" style="margin-top:10px"><button class="sec" data-act="tog" data-id="' + q.id + '">' + (q.is_active ? "Hide karo" : "Show karo") + '</button>' +
    '<button class="sec" data-act="edit" data-id="' + q.id + '">Edit</button></div>' +
    '<div id="ed_' + q.id + '"></div></div>'
  ).join("") || '<div class="meta">Koi sawal nahi mila.</div>';
  $("more").textContent = rows.length > SHOW ? ("Pehle " + SHOW + " dikh rahe hain. Khoj se chhota karo.") : "";
}


function fillSubjects() {
  const m = {};
  ALL.forEach(q => { (m[q.subject] = m[q.subject] || new Set()).add(q.chapter); });
  window.SC = m;
  $("aSub").innerHTML = Object.keys(m).map(s => '<option>' + esc(s) + '</option>').join("");
  fillChapters();
}
function fillChapters() {
  const s = $("aSub").value, c = window.SC && window.SC[s] ? [...window.SC[s]] : [];
  $("aChap").innerHTML = c.map(x => '<option>' + esc(x) + '</option>').join("");
}
async function saveNew() {
  const msg = $("addMsg"); msg.style.color = "var(--bad)"; msg.textContent = "";
  const question = $("aQ").value.trim(), explanation = $("aExp").value.trim();
  const options = [0,1,2,3].map(i => $("aO" + i).value.trim());
  if (!question) { msg.textContent = "Sawal likho."; return; }
  if (options.some(o => !o)) { msg.textContent = "Chaaron options bharo."; return; }
  if (new Set(options).size < 4) { msg.textContent = "Options alag-alag hone chahiye."; return; }
  if (ALL.some(q => q.question === question)) { msg.textContent = "Ye sawal pehle se hai (same text)."; return; }
  const exams = $("aEx").value.split(",").map(s => s.trim()).filter(Boolean);
  const body = { subject: $("aSub").value, chapter: $("aChap").value, question, options,
    answer: parseInt($("aAns").value, 10), explanation, exams, is_active: $("aAct").checked };
  $("saveAdd").disabled = true;
  try {
    await api("/rest/v1/questions", { method: "POST", headers: { Prefer: "return=representation" }, body: JSON.stringify(body) });
    msg.style.color = "var(--ok)"; msg.textContent = "Save ho gaya.";
    ["aQ","aO0","aO1","aO2","aO3","aExp","aEx"].forEach(i => $(i).value = "");
    await loadQuestions();
  } catch (e) { msg.textContent = "Save fail: " + e.message; }
  $("saveAdd").disabled = false;
}
$("toggleAdd").onclick = () => $("addBox").classList.toggle("hide");
$("aSub").onchange = fillChapters;
$("saveAdd").onclick = saveNew;

async function patchQ(id, body) {
  const r = await api("/rest/v1/questions?id=eq." + id, { method: "PATCH", headers: { Prefer: "return=representation" }, body: JSON.stringify(body) });
  if (!r || !r.length) throw new Error("Koi row update nahi hui (admin permission check karo).");
  return r[0];
}
function optsHtml(arr, cur) {
  const a = arr.includes(cur) ? arr : [cur].concat(arr);
  return a.map(x => '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>').join("");
}
function openEdit(id) {
  const q = ALL.find(x => x.id === id), box = $("ed_" + id);
  if (box.innerHTML) { box.innerHTML = ""; return; }
  const subs = Object.keys(window.SC);
  const chs = [...(window.SC[q.subject] || [])];
  box.innerHTML = '<div style="margin-top:10px">' +
    '<select id="es_' + id + '" style="margin-bottom:10px">' + optsHtml(subs, q.subject) + '</select>' +
    '<select id="ec_' + id + '" style="margin-bottom:10px">' + optsHtml(chs, q.chapter) + '</select>' +
    '<textarea id="eq_' + id + '" rows="3">' + esc(q.question) + '</textarea>' +
    [0,1,2,3].map(i => '<input id="eo' + i + '_' + id + '" value="' + esc((q.options || [])[i]) + '">').join("") +
    '<select id="ea_' + id + '" style="margin-bottom:10px">' + [0,1,2,3].map(i => '<option value="' + i + '"' + (i === q.answer ? ' selected' : '') + '>Sahi jawab: Option ' + (i + 1) + '</option>').join("") + '</select>' +
    '<textarea id="ex_' + id + '" rows="3">' + esc(q.explanation) + '</textarea>' +
    '<input id="ee_' + id + '" value="' + esc((q.exams || []).join(", ")) + '">' +
    '<div class="meta" style="margin-bottom:8px">Dhyan: sawal ka text badalne par us sawal ka purana progress (done/saved/wrong) jud nahi payega.</div>' +
    '<button data-act="save" data-id="' + id + '">Save badlaav</button><div id="em_' + id + '" class="msg"></div></div>';
  $("es_" + id).onchange = () => {
    const c = [...(window.SC[$("es_" + id).value] || [])];
    $("ec_" + id).innerHTML = c.map(x => '<option>' + esc(x) + '</option>').join("");
  };
}
async function saveEdit(id) {
  const msg = $("em_" + id); msg.style.color = "var(--bad)"; msg.textContent = "";
  const question = $("eq_" + id).value.trim();
  const options = [0,1,2,3].map(i => $("eo" + i + "_" + id).value.trim());
  if (!question) { msg.textContent = "Sawal khaali nahi ho sakta."; return; }
  if (options.some(o => !o) || new Set(options).size < 4) { msg.textContent = "Chaaron options bharo aur alag rakho."; return; }
  if (ALL.some(q => q.id !== id && q.question === question)) { msg.textContent = "Ye text kisi aur sawal me pehle se hai."; return; }
  const body = { subject: $("es_" + id).value, chapter: $("ec_" + id).value, question, options,
    answer: parseInt($("ea_" + id).value, 10), explanation: $("ex_" + id).value.trim(),
    exams: $("ee_" + id).value.split(",").map(s => s.trim()).filter(Boolean), updated_at: new Date().toISOString() };
  try { await patchQ(id, body); await loadQuestions(); }
  catch (e) { msg.textContent = "Save fail: " + e.message; }
}
$("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const id = b.dataset.id, q = ALL.find(x => x.id === id);
  if (b.dataset.act === "edit") openEdit(id);
  else if (b.dataset.act === "save") saveEdit(id);
  else if (b.dataset.act === "tog") {
    b.disabled = true;
    try { await patchQ(id, { is_active: !q.is_active, updated_at: new Date().toISOString() }); await loadQuestions(); }
    catch (er) { alert("Fail: " + er.message); b.disabled = false; }
  }
});

async function backupAll() {
  const b = $("backupBtn"); b.disabled = true;
  try {
    const rows = await api("/rest/v1/questions?select=*&order=created_at.asc&limit=5000");
    const d = new Date().toISOString().slice(0, 10);
    const blob = new Blob([JSON.stringify(rows, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "jakhar_questions_" + d + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    alert("Backup ban gaya: " + rows.length + " sawal (hidden samet). File Downloads me hai.");
  } catch (e) { alert("Backup fail: " + e.message); }
  b.disabled = false;
}
$("backupBtn").onclick = backupAll;

let BULK = [];
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const first = text.split(/\r?\n/, 1)[0];
  const d = first.includes("\t") ? "\t" : ",";
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"' && f === "") q = true;
    else if (c === d) { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
function bulkCheck() {
  const msg = $("bkMsg"); msg.style.color = "var(--bad)"; BULK = []; $("bkGo").disabled = true;
  const rows = parseCSV($("bkText").value);
  if (rows.length < 2) { msg.textContent = "Pehli line header ki aur uske neeche kam se kam ek sawal chahiye."; return; }
  const hdr = rows[0].map(x => x.trim().toLowerCase());
  const need = ["subject","chapter","question","option1","option2","option3","option4","answer"];
  const miss = need.filter(n => !hdr.includes(n));
  if (miss.length) { msg.textContent = "Header me ye column nahi mile: " + miss.join(", ") + "\n(Template se naam copy karo)"; return; }
  const ix = n => hdr.indexOf(n);
  const seen = new Set(ALL.map(q => q.question)), errs = [];
  const amap = { A:0, B:1, C:2, D:3, "1":0, "2":1, "3":2, "4":3 };
  rows.slice(1).forEach((r, k) => {
    const g = n => ix(n) >= 0 ? (r[ix(n)] || "").trim() : "";
    const e = [], subject = g("subject"), chapter = g("chapter"), question = g("question");
    const options = [1,2,3,4].map(i => g("option" + i));
    const a = amap[g("answer").toUpperCase()];
    if (!question) e.push("sawal khaali");
    if (options.some(o => !o)) e.push("option khaali");
    else if (new Set(options).size < 4) e.push("options alag-alag nahi");
    if (a === undefined) e.push("answer 1-4 ya A-D hona chahiye");
    if (!(window.SC && window.SC[subject] && window.SC[subject].has(chapter))) e.push("subject/chapter DB me nahi mila (spelling check karo)");
    if (question && seen.has(question)) e.push("ye sawal pehle se hai / file me dobara");
    if (e.length) { errs.push("Line " + (k + 2) + ": " + e.join(", ")); return; }
    seen.add(question);
    BULK.push({ subject, chapter, question, options, answer: a, explanation: g("explanation"),
      exams: g("exams").split(/[,;|]/).map(s => s.trim()).filter(Boolean) });
  });
  msg.style.color = errs.length ? "var(--bad)" : "var(--ok)";
  msg.textContent = "Sahi: " + BULK.length + "   Galat: " + errs.length + (errs.length ? "\n\n" + errs.slice(0, 15).join("\n") + (errs.length > 15 ? "\n...aur " + (errs.length - 15) + " line" : "") : "");
  $("bkGo").disabled = BULK.length === 0;
}
async function bulkGo() {
  if (!BULK.length) return;
  if (!confirm(BULK.length + " sawal import karein?")) return;
  const msg = $("bkMsg"); $("bkGo").disabled = true; $("bkCheck").disabled = true;
  const active = $("bkAct").checked; let done = 0;
  try {
    for (let i = 0; i < BULK.length; i += 50) {
      const chunk = BULK.slice(i, i + 50).map(q => ({ ...q, is_active: active }));
      await api("/rest/v1/questions", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify(chunk) });
      done += chunk.length; msg.style.color = ""; msg.textContent = "Import ho raha hai... " + done + "/" + BULK.length;
    }
    msg.style.color = "var(--ok)"; msg.textContent = "Import ho gaya: " + done + " sawal. Ab ek Backup le lo.";
    BULK = []; $("bkText").value = ""; $("bkFile").value = "";
    await loadQuestions();
  } catch (e) {
    msg.style.color = "var(--bad)"; msg.textContent = "Import beech me ruka (" + done + " ho chuke): " + e.message + "\nList dekho, fir bachhe hue ko dobara Jaanch karke import karo (duplicate apne-aap pakde jayenge).";
    await loadQuestions();
  }
  $("bkCheck").disabled = false;
}
function bulkTemplate() {
  const s = "subject,chapter,question,option1,option2,option3,option4,answer,explanation,exams\n" +
    '"' + ($("aSub").value || "विषय") + '","' + ($("aChap").value || "चैप्टर") + '","यहाँ सवाल लिखो","विकल्प 1","विकल्प 2","विकल्प 3","विकल्प 4",2,"यहाँ व्याख्या","RPSC RAS 2021; Patwari 2021"\n';
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + s], { type: "text/csv;charset=utf-8" }));
  a.download = "jakhar_questions_template.csv"; document.body.appendChild(a); a.click(); a.remove();
}
$("toggleBulk").onclick = () => $("bulkBox").classList.toggle("hide");
$("bkFile").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $("bkText").value = r.result; bulkCheck(); }; r.readAsText(f, "utf-8"); };
$("bkCheck").onclick = bulkCheck; $("bkGo").onclick = bulkGo; $("tplBtn").onclick = bulkTemplate;
$("loginBtn").onclick = login;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("logoutBtn").onclick = logout;
$("search").oninput = render;
$("statusF").onchange = render;
</script>
</body>
</html>
