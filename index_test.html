ht:600;vertical-align:top;\">4. जयपुर</span></span></span>", "exams": [], "options": ["1234", "4321", "3412", "3142"], "answer": 2, "explanation": "विस्तृत व्याख्या एवं महत्वपूर्ण भ्रम निवारण (Confusion Clear):<br><br>उदय सागर (उदयपुर): इस झील का निर्माण मेवाड़ के महाराणा उदय सिंह द्वितीय द्वारा 1559–1565 के दौरान करवाया गया था। बेड़च (आयड़) नदी का पानी इसी झील में गिरता है और इसके बाद वह 'बेड़च' कहलाती है।<br><br>कायलाना झील (जोधपुर): यह जोधपुर की प्रसिद्ध मीठे पानी की कृत्रिम झील है, जिसका आधुनिक स्वरूप सर प्रताप सिंह द्वारा विकसित करवाया गया था। वर्तमान में यह राजीव गांधी लिफ्ट नहर से जुड़ी हुई है।<br><br>गैब सागर / एडवर्ड सागर (डूंगरपुर): इसका निर्माण महारावल गोपीनाथ ने करवाया था। इसके तट पर बादल महल और विजय राजराजेश्वर मंदिर स्थित हैं।<br><br>परीक्षार्थी भ्रम निवारण नोट (रामगढ़ झील/स्थान):<br>अक्सर छात्र 'रामगढ़' नाम को लेकर भ्रमित होते हैं क्योंकि राजस्थान में इस नाम से एक से अधिक प्रमुख भौगोलिक स्थल हैं:<br><br>रामगढ़ (जयपुर - प्रश्न का संदर्भ): यहाँ बाणगंगा नदी पर स्थित प्रसिद्ध रामगढ़ बाँध/झील है, जिसे ऐतिहासिक रूप से जयपुर की जीवनरेखा कहा जाता था। तालिका में 'जयपुर' विकल्प होने के कारण इसका सही मिलान जयपुर से ही होगा।<br><br>रामगढ़ (बारां): बारां जिले का रामगढ़ उल्कापिंड के टकराने से बने क्रेटर (Meteorite Crater Lake) के लिए पूरे भारत में प्रसिद्ध है (जिसे जियो-हेरिटेज साइट का दर्जा प्राप्त है) तथा यहाँ 10वीं सदी का मिनी-खजुराहो 'भंड देवरा मंदिर' स्थित है।<br><br>रामगढ़ शेखावाटी (सीकर): यह कस्बा अपनी प्राचीन हवेलियों और भित्ति चित्रों (Frescoes) के लिए जाना जाता है।<br><br>रामगढ़ (जैसलमेर): यहाँ राज्य का सबसे ऊँचा दूरदर्शन टावर और गैस थर्मल पावर प्लांट स्थित है।<br><br>अतः परीक्षा में जब झीलों के संदर्भ में प्रश्न आए, तो विकल्पों में जयपुर (रामगढ़ बाँध/झील) अथवा बारां (रामगढ़ क्रेटर झील) की उपलब्धता देखकर ही उत्तर तय करें। इस प्रश्न में बारां का विकल्प न होने से सही उत्तर केवल जयपुर ही बनेगा।"},

ont-size:15px;font-weight:600;vertical-align:top;\">(IV) भरतपुर</span></span></span>", "exams": ["A.A.R.O. (GK and Entomology) 2022"], "options": ["(IV), (III), (II), (I)", "(II), (III), (IV), (I)", "(III), (IV), (II), (I)", "(IV), (II), (III), (I)"], "answer": 0, "explanation": "मोती झील भरतपुर जिले से संबंधित है, इसलिए A-IV सही है। बुझ झील जैसलमेर में स्थित है, इसलिए B-III होगा। आनंद सागर झील बांसवाड़ा में तथा तलवाड़ा झील हनुमानगढ़ से संबंधित है। अतः सही क्रम IV-III-II-I है।"},

  {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "देश में राजस्थान के खनिज स्रोतों के योगदान को बढ़ते क्रम में व्यवस्थित करें:<br>a. पोटाश<br>b. जिप्सम<br>c. ताम्र अयस्क<br>d. टंगस्टन<br>नीचे दिए गए विकल्पों में से सबसे उपयुक्त उत्तर चुनें:", "exams": ["Lab Assistant Exam 2026 (Science)"], "options": ["c, d, a, b", "b, d, c, a", "a, c, b, d", "d, c, b, a"], "answer": 3, "explanation": "💡 सही उत्तर: D (d, c, b, a)<br>━━━━━━━━━━━━━━━━━━━━━━━━━━<br>📌 प्रश्न का हल (बढ़ता क्रम):<br>━━━━━━━━━━━━━━━━━━━━━━━━━━<br>देश के कुल खनिज संसाधनों में राजस्थान की हिस्सेदारी (प्रति शत में):<br>1. (d) टंगस्टन ─── 27%<br>2. (c) ताम्र (तांबा) अयस्क ─── 54%<br>3. (b) जिप्सम ─── 82%<br>4. (a) पोटाश ─── 94%<br>अतः सही बढ़ता क्रम (Increasing Order) है:<br>टंगस्टन (27%) &lt; तांबा (54%) &lt; जिप्सम (82%) &lt; पोटाश (94%)<br>अर्थात: d, c, b, a<br>━━━━━━━━━━━━━━━━━━━━━━━━━━<br>🧠 याद रखने की स्मार्ट ग्रुपिंग व ट्रिक्स:<br>━━━━━━━━━━━━━━━━━━━━━━━━━━<br>सभी आँकड़ों को एक साथ रटने के बजाय इन्हें प्रति शत के आधार पर 4 श्रेणियों (Groups) में याद रखें:<br>1. ग्रुप 1: 'दोगुना' संबंध (Double Relation Trick)<br>• टंगस्टन = 27%<br>• तांबा = 54% (27 का ठीक दोगुना: 27 × 2 = 54%)<br>👉 ट्रिक: \"27 का टंगस्टन, दुगुना (54) तांबा\"<br>2. ग्रुप 2: 20-30% वाले (कम हिस्सेदारी)<br>• टंगस्टन: 27%<br>• फ्लोराइट: 29%<br>• रॉक फॉस्फेट: 31%<br>👉 ट्रिक: 27, 29, 31 (2-2 का अंतर) ➔ \"टंग-फ्लो-रॉक\"<br>3. ग्रुप 3: 80% से 95% वाले (अत्यधिक हिस्सेदारी - Super Dominant)<br>• गेरू: 81%<br>• जिप्सम: 82%<br>• चांदी / वोलास्टोनाइट: 88%<br>• सीसा-जस्ता अयस्क: 89%<br>• पोटाश: 94%<br>👉 ट्रिक: \"गेरू (81), जिप्सम (82) की चांदी (88), सीसा (89) और पोटाश (94) की आँधी\"<br>4. ग्रुप 4: 60% से 75% वाले (मध्यम-उच्च हिस्सेदारी)<br>• एस्बेस्टस: 61%<br>• मार्बल: 63%<br>• फेल्डस्पार: 66%<br>• डोलोमाइट: 72%<br>• फुलर्स अर्थ: 74%<br>• बेंटोनाइट: 75%<br>━━━━━━━━━━━━━━━━━━━━━━━━━━<br>📊 त्वरित संदर्भ तालिका (Quick Revision Table):<br>━━━━━━━━━━━━━━━━━━━━━━━━━━<br>• पोटाश ─── 94%<br>• सीसा-जस्ता अयस्क ─── 89%<br>• च   {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "भुखिया - जगपुरा - देलवाड़ा पाया जाना जाता है -", "exams": ["Food Safety Officer Exam 2022"], "options": ["मैंगनीज के भंडार के लिए", "टंगस्टन के भंडार के लिए", "सोने के भंडार के लिए", "क्वार्ट्ज के भंडार के लिए"], "answer": 2, "explanation": "भुखिया-जगपुरा-देलवाड़ा क्षेत्र सोने के भंडार से जुड़ा है। आनंदपुर भुकिया और जगपुरा क्षेत्रों में सोने के खनन का कार्य हिन्दुस्तान ज़िंक लिमिटेड कर रही है, इसलिए सही उत्तर सोने के भंडार के लिए है।"},
  {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "बीकानेर के पलाना में ______ के निक्षेप हैं।", "exams": ["RPSC EO/RO Exam 2022 Shift-1"], "options": ["कोयला (लिग्नाइट)", "लिथियम", "यूरेनियम", "ग्रेफाइट"], "answer": 0, "explanation": "बीकानेर के पलाना में लिग्नाइट कोयले के निक्षेप हैं। लिग्नाइट उत्पादन में राजस्थान का स्थान तमिलनाडु और गुजरात के बाद तीसरा है। RSMML राज्य सरकार का एक उद्यम है, जो लिग्नाइट निक्षेपों के विकास पर ध्यान देता है। 1967 में पलाना की खदानें बंद होने पर गिरल राजस्थान की पहली आधुनिक ओपनकास्ट लिग्नाइट खदान बनी।"},

  {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "निम्नांकित में से कौन सी आग्नेय चट्टानें जालौर में पाई जाती हैं -<br>(i) गेब्रो<br>(ii) ग्रेनाइट<br>(iii) रायोलाइट<br>(iv) बेसाल्ट", "exams": ["CET 2022 (12th Level) Shift-2 (04 February 2023)"], "options": ["(iii) व (iv)", "(ii) व (iii)", "(i) व (iv)", "(i) व (ii)"], "answer": 1, "explanation": "मालानी श्रेणी रायोलाइट लावा समूह से बनी है और अरावली संरचना पर टिकी हुई है। इस आग्नेय समूह की शैलों के निक्षेपों को मालानी क्षेत्र के नाम पर मालानी श्रेणी कहा जाता है। जालौर ग्रेनाइट, सिवाना और एरिनपुरा ग्रेनाइट मालानी श्रेणी के अंतर्गत आते हैं। जालौर में ग्रेनाइट और रायोलाइट आग्नेय चट्टानें पाई जाती हैं, इसलिए सही उत्तर (ii) व (iii) है।"},
  {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "राजस्थान में निम्नलिखित में से कौनसा क्षेत्र पेट्रोलियम भंडार क्षेत्र नहीं है -", "exams": ["High Court LDC 2022 (12 March 2023)"], "options": ["बंधेवाला", "घोटारू", "रागेश्वरी", "डांडेवाला"], "answer": 3, "explanation": "तनोट-डांडेवाला ब्लॉक में तनोट, डांडेवाला और बागीटिब्बा, ये 3 क्षेत्र शामिल हैं। इस क्षेत्र में लगभग 2411.3 मिलियन घनमीटर गैस के सिद्ध भंडार खोजे गए हैं और वर्तमान में यहाँ के 22 कुओं से गैस का उत्पादन चल रहा है। यह ब्लॉक गैस भंडारों से जुड़ा है, इसलिए दिए गए विकल्पों में पेट्रोलियम भंडार क्षेत्र न होने वाला उत्तर डांडेवाला है।"},
  {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "गुलाबी संगमरमर का खनन क्षेत्र _____ है।", "exams": ["3rd Grade Teacher 2022 Sindhi L2 (राजस्थान सामान्य ज्ञान व शैक्षिक परिदृश्य)"], "options": ["केसरीयाजी", "बाबरमल", "डूंगरपुर", "कुमारी"], "answer": 1, "explanation": "राजस्थान में गुलाबी संगमरमर (मार्बल) मुख्य रूप से उदयपुर स्थित बाबरमल खान से प्राप्त होता है। भरतपुर जिले की रूपवास तहसील से भी गुलाबी मार्बल निकाला जाता है, जिसकी उत्पत्ति लगभग 600 मिलियन वर्ष पहले हुई थी। इसके अलावा उदयपुर के देवीमाता और केवड़ा-बाबरभात स्थानों से तथा अजमेर जिले के भाटसूरी, दौलतपुरा और सलेमाबाद क्षेत्रों से भी गुलाबी संगमरमर प्राप्त किया जाता है।"},
  {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "राजस्थान राज्य खान एवं खनिज लिमिटेड (आर.एस.एम.एम.एल.) के स्ट्रेटेजिक बिजनेस यूनिट एवं प्रॉफिट सेंटर लिग्नाइट की स्थापना की गई है-", "exams": ["3rd Grade Teacher 2022 Sanskrit L2"], "options": ["उदयपुर", "बीकानेर", "जोधपुर", "जयपुर"], "answer": 3, "explanation": "RSMML (राजस्थान स्टेट माइन्स एंड मिनरल्स लिमिटेड) राज्य सरकार का खनन उपक्रम है, जिसका मुख्यालय उदयपुर में है। अलग-अलग खनिजों का कार्य सँभालने के लिए इसकी रणनीतिक व्यावसायिक इकाइयाँ (SBU) और प्रॉफिट सेंटर बनाए गए हैं।<br>• इस प्रश्न के अनुसार लिग्नाइट से जुड़ी रणनीतिक व्यावसायिक इकाई एवं प्रॉफिट सेंटर की स्थापना जयपुर में की गई है।<br>• परीक्षा-दृष्टि: मुख्यालय (उदयपुर) और लिग्नाइट इकाई (जयपुर) को आपस में न मिलाएँ। झामर-कोटड़ा (उदयपुर) की रॉक फॉस्फेट खान भी RSMML के स्वामित्व में है।"},
  {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "B.P.R.L. का पेट्रोलियम खनन क्षेत्र है-", "exams": ["3rd Grade Teacher 2022 Sanskrit L2"], "options": ["सादेवाला", "भाग्यम", "चीनेवाला", "डांडेवाला"], "answer": 0, "explanation": "BPRL (Bharat PetroResources Limited) का पेट्रोलियम खनन क्षेत्र जैसलमेर जिले का सादेवाला है।<br>भाग्यम बाड़मेर बेसिन का तेल क्षेत्र है, इसलिए इसे सादेवाला से न जोड़ें।<br>एक साथ याद करें: जैसलमेर बेसिन → सादेवाला (BPRL), मानहेरा टिब्बा (प्राकृतिक गैस); बाड़मेर बेसिन → मंगला, भाग्यम।"},
  {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "बाड़मेर-सांचौर बेसिन में कौन-सा पेट्रोलियम उत्पादन केन्द्र स्थित नहीं है -", "exams": ["3rd Grade Teacher 2022 Sanskrit L2"], "options": ["कामेश्वरी", "तुकाराम", "सादेवाला", "शक्ति"], "answer": 2, "explanation": "सादेवाला जैसलमेर जिले में स्थित BPRL का पेट्रोलियम क्षेत्र है, बाड़मेर-सांचौर बेसिन का केन्द्र नहीं। इसलिए 'स्थित नहीं है' वाले इस प्रश्न का उत्तर सादेवाला है।<br>• तुकाराम, शक्ति और कामेश्वरी इस प्रश्न में बाड़मेर-सांचौर बेसिन के उत्पादन केन्द्र माने गए हैं।<br>• परीक्षा-दृष्टि: 'नहीं है' वाले प्रश्नों में पहले बेसिन तय करें — जैसलमेर बेसिन (सादेवाला, मानहेरा टिब्बा) और बाड़मेर-सांचौर बेसिन (मंगला, भाग्यम आदि) को अलग-अलग याद रखें।"},

  {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "बाँसवाड़ा जिले के सिवानिया, काला खूंटा, घाटिया क्षेत्र ____ खनिज के भण्डारों के लिये जाने जाते हैं।", "exams": ["3rd Grade Teacher 2022 Hindi L2"], "options": ["टंगस्टन", "चाँदी", "सीसा-जस्ता", "मैंगनीज़"], "answer": 3, "explanation": "बाँसवाड़ा जिले की सिवानिया, काला खूंटा और घाटिया पेटी मैंगनीज़ के भण्डारों के लिए जानी जाती है।<br>• बाँसवाड़ा राज्य के प्रमुख मैंगनीज़ क्षेत्रों में गिना जाता है।<br>• अन्य मैंगनीज़ क्षेत्र: लीलवानी; छोटी सार-बड़ी सार (उदयपुर) और नेगड़िया (राजसमंद) के पास मैंगनीज़ के छोटे निक्षेप।<br>• परीक्षा-दृष्टि: बाँसवाड़ा = सोना (भूकिया-जगपुरा) + मैंगनीज़ (काला खूंटा)। दोनों को साथ दोहराएँ।"},
  {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "अकवाली निक्षेप ______ के लिए प्रसिद्ध हैं।", "exams": ["3rd Grade Teacher 2022 Social Studies L2"], "options": ["फेल्डस्पार", "ताँबा", "लोहा", "संगमरमर"], "answer": 1, "explanation": "अकवाली निक्षेप ताँबे (ताम्र) के लिए प्रसिद्ध हैं।<br>• राजस्थान के ताँबा क्षेत्र एक साथ याद करें: खेतड़ी-सिंघाना (झुंझुनूं की प्रमुख ताम्र पेटी), खो-दरीबा (अलवर) और अकवाली।<br>• परीक्षा-दृष्टि: ताँबे को 'ताम्र' कहते हैं, जबकि 'तामड़ा' गार्नेट का स्थानीय नाम है — इन दोनों में गड़बड़ न करें।"},
  {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "बाल्दा (सिरोही) ______ के लिए प्रमुख भण्डारण क्षेत्र है।", "exams": ["3rd Grade Teacher 2022 Social Studies L2"], "options": ["ताँबा", "चाँदी", "टंगस्टन", "लोहा"], "answer": 2, "explanation": "बाल्दा (सिरोही) टंगस्टन का प्रमुख भण्डारण क्षेत्र है। टंगस्टन वोल्फ्रामाइट नामक अयस्क से प्राप्त किया जाता है।<br>जिलेवार टंगस्टन क्षेत्र:<br>• नागौर — डेगाना (प्रमुख खनन क्षेत्र)<br>• पाली — नानाकराब, बारबरा<br>• सिरोही — आबू, रेवदर, बाल्दा, देवा-का-बेड़ा, उदावरिया<br>• अजमेर — बीजाथल, पिपरिया, सेवरिया<br>उपयोग: बिजली के बल्ब बनाने और गोलियाँ बनाने में।<br>परीक्षा-दृष्टि: टंगस्टन = डेगाना (नागौर) सबसे पहले याद रखें; बाकी जिलों के क्षेत्र-नाम भी इसी विषय में पूछे जाते हैं।"},
  {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "बिलारा चूनापत्थर क्षेत्र _____ में स्थित नहीं है।", "exams": ["3rd Grade Teacher 2022 Social Studies L2"], "options": ["श्रीगंगानगर", "बीकानेर", "नागौर", "जोधपुर"], "answer": 0, "explanation": "बिलारा चूना-पत्थर क्षेत्र नागौर, जोधपुर और बीकानेर वाली पेटी से जुड़ा माना गया है; श्रीगंगानगर इसमें शामिल नहीं है, इसलिए वही 'स्थित नहीं है' का उत्तर है।<br>• बिलारा कस्बा जोधपुर जिले में है; इसी नाम से यह चूना-पत्थर क्षेत्र जाना जाता है।<br>• परीक्षा-दृष्टि: स्थान-खनिज जोड़े अलग-अलग याद रखें — बिलारा = चूना-पत्थर, मानहेरा टिब्बा = प्राकृतिक गैस, पलाना = लिग्नाइट।"},

  {"subject": "राजस्थान का भूगोल", "chapter": "राजस्थान के खनिज संसाधन", "question": "दिये गये खनिजों एवं उनके खनन क्षेत्रों में से त्रुटिपूर्ण (गलत) युग्म की पहचान कीजिए:<br>खनिज - खनन क्षेत्र", "exams": ["Lecturer (Tech. Edu.) Exam - 2020"], "options": ["ताँबा - खेतड़ी-सिंघाना", "टंगस्टन - झामर-कोटड़ा", "जस्ता एवं सीसा - जावर", "लोहा-अयस्क - नाथरा-की-पाल"], "answer": 1, "explanation": "टंगस्टन का प्रमुख क्षेत्र डेगाना (नागौर) है। झामर-कोटड़ा (उदयपुर) रॉक फॉस्फेट की खान है, इसलिए 'टंगस्टन - झामर-कोटड़ा' गलत युग्म है।<br>झामर-कोटड़ा के बारे में: यह दक्षिणी राजस्थान में अरावली पर्वतमाला के बीच उदयपुर जिले में स्थित है। इसे भारत में फॉस्फेट का सबसे बड़ा भण्डार माना जाता है और देश के व्यावसायिक रूप से दोहन-योग्य रॉक फॉस्फेट का प्रमुख स्रोत है।<br>बाकी तीनों युग्म सही हैं: लौह अयस्क – नाथरा-की-पाल, ताँबा – खेतड़ी-सिंघाना, सीसा-जस्ता – जावर (उदयपुर)।<br>परीक्षा-दृष्टि: रॉक फॉस्फेट = झामर-कोटड़ा (उदयपुर); टंगस्टन = डेगाना (नागौर)।"},

ight:600;vertical-align:top;\">(iv) जामसर</span></span></span>", "exams": ["Forest Guard Exam 2022 Shift 4"], "options": ["a-iv, b-i, c-iii, d-ii", "a-iii, b-iv, c-ii, d-i", "a-i, b-ii, c-iv, d-iii", "a-iii, b-iv, c-i, d-ii"], "answer": 1, "explanation": "सही मिलान: (a) कॉपर – (iii) खो-दरीबा; (b) जिप्सम – (iv) जामसर; (c) सीसा और जस्ता – (ii) राजपुरा-दरीबा क्षेत्र; (d) रॉक फॉस्फेट – (i) झामर-कोटड़ा। इसलिए उत्तर a-iii, b-iv, c-ii, d-i है।<br>• खो-दरीबा (अलवर) — जिप्सम, बेराइट्स और ताँबे के लिए जाना जाता है।<br>• जामसर (बीकानेर) — जिप्सम के लिए प्रसिद्ध।<br>• राजपुरा-दरीबा (राजसमंद) — भूमिगत सीसा-जस्ता खान।<br>• झामर-कोटड़ा (उदयपुर) — रॉक फॉस्फेट की खान; भारत में फॉस्फेट का सबसे बड़ा भण्डार; RSMML (राजस्थान स्टेट माइन्स एंड मिनरल्स लिमिटेड) के स्वामित्व में।<br>परीक्षा-दृष्टि: जिप्सम के लिए दो क्षेत्र (जामसर और खो-दरीबा) पढ़ें, पर इस प्रश्न के विकल्पों में जिप्सम के साथ जामसर ही मेल खाता है।"},

  const h=store.get("jk_hist")[i];
  if(!h||!h.qs)return toast("इस टेस्ट का विस्तृत रिज़ल्ट उपलब्ध नहीं है");
  const it=h.qs.map((t,k)=>({q:QS.find(x=>x.question===t),p:h.p[k],t:h.t[k],rv:h.rv[k]})).filter(x=>x.q);
  if(!it.length)return toast("इस टेस्ट के प्रश्न अब उपलब्ध नहीं हैं");
  Q=it.map(x=>x.q);state=it.map(x=>({picked:x.p,time:x.t,review:!!x.rv}));mode=h.m;label=h.n;finished=true;cur=0;ret=home;

function R(o){
  const inner=`<span class="ic${o.raw?" raw":""}">${o.i}</span><span class="tx"><b>${o.t}</b><small>${o.s||""}</small></span>${o.b?`<span class="bg${o.soon?" soon":""}">${o.b}</span>`:""}<i>›</i>`;
  return o.href?`<a class="row" style="--c:${o.c}" href="${o.href}"${o.ext?' target="_blank" rel="noopener"':""}>${inner}</a>`:`<button class="row" style="--c:${o.c}" onclick="${o.on}">${inner}</button>`;
}

  const fail=()=>{const bx=document.getElementById("dvpages");if(bx)bx.innerHTML=`<div class="card cs"><p>PDF यहाँ नहीं दिख पाई।</p><a class="btn" style="display:block;text-decoration:none;text-align:center" href="${dvE(url)}" target="_blank" rel="noopener">नए टैब में खोलें ↗</a></div>`};

      if(!e.isIntersecting)return;io.unobserve(e.target);
      try{const c=e.target,pg=await pdf.getPage(+c.dataset.n),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:w/v0.width*dpr});
        c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise}catch(x){}
    }),{rootMargin:"700px"});
    for(let n=1;n<=pdf.numPages;n++){const c=document.createElement("canvas");c.className="dvpg";c.dataset.n=n;c.width=Math.round(w*dpr);c.height=Math.round(w*dpr*ratio);box.appendChild(c);io.observe(c)}
  }catch(e){fail()}
}

function sortList(list,dir){
  const arr=list.map((q,i)=>({q:q,i:i,k:sortKey(q,dir)}));
  arr.sort((a,b)=>{
    if(a.k.y!==b.k.y){if(!a.k.y)return 1;if(!b.k.y)return -1;return dir==="new"?b.k.y-a.k.y:a.k.y-b.k.y}
    return a.k.e.localeCompare(b.k.e)||a.q.subject.localeCompare(b.q.subject)||a.q.chapter.localeCompare(b.q.chapter)||a.i-b.i});
  return arr.map(x=>x.q);
}

  await Promise.all(ns.map(async n=>{const v=n.nodeValue;n.nodeValue=v.match(/^\s*/)[0]+await gtr(v.trim(),tl)+v.match(/\s*$/)[0]}));return d.innerHTML}
function trPaint(h){const q=Q[cur],n=q.options.length;
  const qe=app.querySelector("p.q");if(qe&&h[0]!==undefined)qe.innerHTML=h[0];
  app.querySelectorAll(".opt .t").forEach((e,i)=>{if(h[i+1]!==undefined)e.innerHTML=h[i+1]});
  const ep=app.querySelector(".exp p");if(ep&&h[n+1]!==undefined)ep.innerHTML=h[n+1];
  const eb=app.querySelector(".exp b");if(eb&&h[q.answer+1]!==undefined)eb.innerHTML="ABCD"[q.answer]+". "+h[q.answer+1];
  const b=document.getElementById("tr");if(b)b.classList.toggle("on",trQ===q.question)}
async function trRun(q){
  const tb=document.getElementById("tr");if(tb)tb.textContent="…";
  try{let c=trCache[q.question];
    if(!c){const parts=[q.question,...q.options,q.explanation||""],part=new Array(parts.length);
      c=await Promise.all(parts.map((h,i)=>trHTML(h,"en").then(r=>{part[i]=r;if(Q[cur]===q&&trOff!==q.question){trQ=q.question;trPaint(part)}return r})));
      trCache[q.question]=c}
    if(Q[cur]===q&&trOff!==q.question){trQ=q.question;trPaint(c)}}
  catch(e){if(Q[cur]===q)trFallback(q)}
  const t2=document.getElementById("tr");if(t2)t2.innerHTML=TRI}

  document.getElementById("askyes").onclick=fn;

function trySubmit(){
  const left=state.filter(s=>s.picked===null).length,rv=state.filter(s=>s.review).length;
  if(!left&&!rv)return finish();
  ask([left?left+" प्रश्न बाकी हैं":"",rv?rv+" प्रश्न रिव्यू में हैं":""].filter(Boolean).join(" और ")+"। फिर भी सबमिट करें?","नहीं, वापस जाएँ","हाँ, सबमिट करें",finish);
}
function pick(i){if(finished)return;if(mode==="practice"&&state[cur].picked!==null)return;stopTimer();state[cur].picked=i;
  if(i!==Q[cur].answer){const ws=new Set(store.get("pyq_wrong"));ws.add(Q[cur].question);store.set("pyq_wrong",[...ws])}
  render(true)}
function go(n){if(!stopped())stopTimer();cur=n;render()}

function finish(){
  if(!stopped())stopTimer();
  clearInterval(tick);finished=true;clearProg();
  let r=0,w=0,s=0,t=0;
  state.forEach((x,i)=>{t+=x.time;if(x.picked===null)s++;else if(x.picked===Q[i].answer)r++;else w++});
  const ws=new Set(store.get("pyq_wrong")),ds=new Set(store.get("jk_done"));
  state.forEach((x,i)=>{if(x.picked===null)return;ds.add(Q[i].question);if(x.picked!==Q[i].answer)ws.add(Q[i].question)});
  store.set("pyq_wrong",[...ws]);store.set("jk_done",[...ds]);

  const H=store.get("jk_hist");H.unshift({n:label,r:r,w:w,s:s,m:mode,sc:sc,ts:Date.now(),qs:Q.map(q=>q.question),p:state.map(x=>x.picked),t:state.map(x=>x.time),rv:state.map(x=>x.review?1:0)});store.set("jk_hist",H);
  const D=new Set(store.get("jk_days"));D.add(day(new Date()));store.set("jk_days",[...D].slice(-400));
  window.__w=Q.filter((q,i)=>state[i].picked!==null&&state[i].picked!==q.answer).map(q=>q.question);
  window.__r=Q.filter((q,i)=>state[i].review).map(q=>q.question);
  RS={r:r,w:w,s:s,t:t,sc:sc};result();
}

  ${test?`<p class="legend" style="margin:-4px 0 10px">अंक = ${r} − (${w} × 1/3) = ${sc}</p>`:""}

  <table><tr><th>प्रश्न</th><th>नतीजा</th><th>समय</th></tr>${state.map((x,i)=>`<tr onclick="cur=${i};render()" style="cursor:pointer"><td>${i+1}</td><td>${x.picked===null?"छोड़ा":x.picked===Q[i].answer?"✅ सही":"❌ गलत"}</td><td>${fmt(x.time)}</td></tr>`).join("")}</table>
  <p class="legend" style="margin-top:8px">किसी भी पंक्ति पर टैप करें — वही प्रश्न सही उत्तर और व्याख्या के साथ खुलेगा।</p>
  <div class="nav res"><button class="btn ghost" onclick="cur=0;render()">📖 सारे उत्तर देखें</button>
  <button class="btn ghost" onclick="startSet(window.__w,'गलत प्रश्न')" ${window.__w.length?"":"disabled"}>❌ गलत (${window.__w.length})</button>
  <button class="btn ghost" onclick="startSet(window.__r,'रिव्यू वाले प्रश्न')" ${window.__r.length?"":"disabled"}>🚩 रिव्यू (${window.__r.length})</button>

}

<script>
/* Background refresh: Supabase se questions la kar cache me rakhta hai (agli baar app khulne par use hoga). Fail ho to chup-chaap ignore. */
(function(){
  const URL_BASE="https://gpqrkxyypadgvguomfrr.supabase.co/rest/v1/questions";
  const KEY="sb_publishable_WIDLgN0x4IX2_LYy2WBWCA_3-zLJvrq";
  async function fetchAll(){
    let all=[],from=0,step=500;
    while(true){
      const r=await fetch(URL_BASE+"?select=id,subject,chapter,question,options,answer,explanation,exams&is_active=eq.true&order=created_at.asc,id.asc",{headers:{apikey:KEY,Authorization:"Bearer "+KEY,Range:from+"-"+(from+step-1)}});
      if(!r.ok&&r.status!==206)throw new Error("HTTP "+r.status);
      const d=await r.json();all=all.concat(d);if(d.length<step)break;from+=step;
    }
    return all;
  }
  function valid(r){return r&&typeof r.question==="string"&&typeof r.subject==="string"&&typeof r.chapter==="string"&&Array.isArray(r.options)&&r.options.length===4&&Number.isInteger(r.answer)&&r.answer>=0&&r.answer<4&&Array.isArray(r.exams)}
  window.addEventListener("load",function(){
    if(!navigator.onLine)return;
    setTimeout(async function(){
      try{
        const qs=await fetchAll();
        if(qs.length>0&&qs.every(valid))localStorage.setItem("jkx_qcache_v1",JSON.stringify({ts:Date.now(),qs:qs}));
      }catch(e){}
    },1500);
  });
})();

<script>
/* Account (login) - email+password, Supabase Auth. Sirf login/logout; progress sync baad ke step me. Session key: jkx_auth */
(function(){
  const BASE="https://gpqrkxyypadgvguomfrr.supabase.co", KEY="sb_publishable_WIDLgN0x4IX2_LYy2WBWCA_3-zLJvrq";
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function load(){try{return JSON.parse(localStorage.getItem("jkx_auth")||"null")}catch(e){return null}}
  function save(s){try{if(s)localStorage.setItem("jkx_auth",JSON.stringify(s));else localStorage.removeItem("jkx_auth")}catch(e){}}
  async function call(path,body){
    /* Fix: 12 sec me jawab na aaye to rok do aur ek baar naye connection se dobara try karo (adhoora purana connection 45 sec latka deta tha) */
    let r;
    for(let t=0;t<2;t++){
      const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);
      try{r=await fetch(BASE+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body),signal:ac.signal});break}
      catch(e){if(t===1)throw new Error("Failed to fetch")}
      finally{clearTimeout(tm)}
    }
    const j=await r.json().catch(()=>null);
    if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description||j.error))||("HTTP "+r.status));
    return j;
  }
  function pack(j){return {access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||"",uid:(j.user&&j.user.id)||""}}
  let RP=null;function refresh(){return RP||(RP=refreshOnce().finally(()=>{RP=null}))}
  async function refreshOnce(){
    const s=load();if(!s||!s.refresh_token)return;
    if(s.expires_at-60>Date.now()/1000)return;
    try{save(pack(await call("/auth/v1/token?grant_type=refresh_token",{refresh_token:s.refresh_token})))}
    catch(e){if(/invalid|expired|not found|revoked/i.test(e.message))save(null)}
  }
  async function qmap(){
    const idOf={},textOf={};

    if(Object.keys(idOf).length<QUESTIONS.length*0.9){
      const r=await fetch(BASE+"/rest/v1/questions?select=id,question&is_active=eq.true",{headers:{apikey:KEY,Range:"0-4999"}});
      if(!r.ok)throw new Error("प्रश्नों की ID नहीं मिल पाई (HTTP "+r.status+")");

      for(let i=0;i<rows.length;i+=400){
        const r=await fetch(BASE+"/rest/v1/user_flags",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+s.access_token,"Content-Type":"application/json",Prefer:"resolution=ignore-duplicates"},body:JSON.stringify(rows.slice(i,i+400))});

      }
      const hd={apikey:KEY,Authorization:"Bearer "+s.access_token,"Content-Type":"application/json"};

      const have=new Set((await hr.json()).map(x=>String(x.ts)));
      const newH=store.get("jk_hist").filter(h=>h&&h.ts&&!have.has(String(h.ts))).map(h=>({data:{n:h.n,r:h.r,w:h.w,s:h.s,m:h.m,sc:h.sc,ts:h.ts,qi:h.qs?h.qs.map(x=>idOf[x]||null):null,p:h.p,t:h.t,rv:h.rv}}));
      for(let i=0;i<newH.length;i+=25){
        const r=await fetch(BASE+"/rest/v1/user_history",{method:"POST",headers:hd,body:JSON.stringify(newH.slice(i,i+25))});
        if(!r.ok){const j=await r.json().catch(()=>null);throw new Error((j&&(j.message||j.msg))||("History HTTP "+r.status))}
      }
      const c=await fetch(BASE+"/rest/v1/user_flags?select=question_id",{headers:{apikey:KEY,Authorization:"Bearer "+s.access_token,Prefer:"count=exact",Range:"0-0"}});
      const total=(c.headers.get("content-range")||"").split("/")[1]||"?";
      m.style.color="#2e7d32";m.textContent="✅ सेव हुआ। सर्वर पर अब कुल "+total+" निशान हैं; "+newH.length+" नए टेस्ट का रिकॉर्ड जुड़ा"+(miss?" ("+miss+" पुराने प्रश्न बिना ID के छूटे)":"")+"।";
    }catch(e){m.style.color="#c62828";m.textContent="Error: "+e.message}
  }
  async function downloadProgress(){
    const m=document.getElementById("acS");m.style.color="";m.textContent="रुकिए...";

      await refresh();const s=load();if(!s)throw new Error("दोबारा लॉगिन करें");

      if(!hr.ok){const j=await hr.json().catch(()=>null);throw new Error((j&&(j.message||j.msg))||("History HTTP "+hr.status))}
      const HL=store.get("jk_hist"),haveTs=new Set(HL.map(h=>String(h.ts))),addH=[];let fixed=0;

    if(m.uid!==uid){
      if(hasLocal){
        const merge=confirm("Is phone par pehle ka progress mila hai. Ise is account me jodna hai?\n\nOK = jodo (recommended)\nCancel = alag rakho (is account ka server wala data dikhega; purana data backup me rahega)");
        if(!merge){backup("jkx_bak_"+Date.now());applying=true;try{LK.forEach(k=>rawSet.call(store,k,[]));rawSet.call(store,"jk_hist",[])}finally{applying=false}}
      }
      m={uid:uid,shadow:{},lastSync:0,pending:true};saveMeta(m);
    }
    const shadow=m.shadow||{};
    const rows=await fetchAll("/rest/v1/user_flags?select=question_id,kind&order=created_at.asc,question_id.asc",tok,1000);
    const S={},L={},H={},up={},dl={},al={},rl={};
    KN.forEach(k=>{S[k]=new Set();L[k]=new Set();H[k]=new Set(shadow[k]||[]);up[k]=[];dl[k]=[];al[k]=[];rl[k]=[]});
    rows.forEach(r=>{if(S[r.kind])S[r.kind].add(r.question_id)});
    KN.forEach(k=>store.get(KINDS[k]).forEach(t=>{const id=idOf[t];if(id)L[k].add(id)}));
    /* device wipe (Reset / storage clear) = removal nahi maana jayega; server se wapas aayega */
    const wipe=!hasLocal&&KN.some(k=>H[k].size);
    KN.forEach(k=>{
      L[k].forEach(id=>{if(!S[k].has(id)){if(H[k].has(id)&&!wipe)rl[k].push(id);else up[k].push(id)}});
      S[k].forEach(id=>{if(!L[k].has(id)){if(H[k].has(id)&&!wipe&&textOf[id])dl[k].push(id);else al[k].push(id)}});
    });
    /* server par upload */
    const upRows=[];KN.forEach(k=>up[k].forEach(id=>upRows.push({question_id:id,kind:k})));
    for(let i=0;i<upRows.length;i+=400)await must(await fetch(BASE+"/rest/v1/user_flags",{method:"POST",headers:hd(tok,{Prefer:"resolution=ignore-duplicates"}),body:JSON.stringify(upRows.slice(i,i+400))}));
    /* server se hatao (jo is phone se hataya gaya) */
    for(const k of KN)for(let i=0;i<dl[k].length;i+=80)await must(await fetch(BASE+"/rest/v1/user_flags?user_id=eq."+uid+"&kind=eq."+k+"&question_id=in.("+dl[k].slice(i,i+80).join(",")+")",{method:"DELETE",headers:hd(tok)}));
    /* phone me badlav (delta, taaki beech me hua naya badlav na mite) */
    let changed=false;
    if(KN.some(k=>rl[k].length))backup();
    applying=true;
    try{
      KN.forEach(k=>{
        const key=KINDS[k],rmT=new Set(rl[k].map(id=>textOf[id]).filter(Boolean)),addT=al[k].map(id=>textOf[id]).filter(Boolean);
        if(!rmT.size&&!addT.length)return;
        const cur=store.get(key),have=new Set(cur),n=cur.filter(t=>!rmT.has(t));
        addT.forEach(t=>{if(!have.has(t)){n.push(t);have.add(t)}});
        rawSet.call(store,key,n);changed=true;
      });
    }finally{applying=false}
    /* history: union by ts (kabhi delete nahi) */
    const hrows=await fetchAll("/rest/v1/user_history?select=data&order=taken_at.desc",tok,1000);
    const srvTs=new Set();hrows.forEach(r=>{if(r.data&&r.data.ts)srvTs.add(String(r.data.ts))});
    const newH=store.get("jk_hist").filter(h=>h&&h.ts&&!srvTs.has(String(h.ts))).map(h=>({data:{n:h.n,r:h.r,w:h.w,s:h.s,m:h.m,sc:h.sc,ts:h.ts,qi:h.qs?h.qs.map(x=>idOf[x]||null):null,p:h.p,t:h.t,rv:h.rv}}));
    for(let i=0;i<newH.length;i+=25){
      const part=newH.slice(i,i+25),r=await fetch(BASE+"/rest/v1/user_history",{method:"POST",headers:hd(tok),body:JSON.stringify(part)});
      if(r.status===409){for(const one of part){const r2=await fetch(BASE+"/rest/v1/user_history",{method:"POST",headers:hd(tok),body:JSON.stringify([one])});if(!r2.ok&&r2.status!==409)await must(r2)}}
      else await must(r);
    }
    const fresh=store.get("jk_hist"),haveTs=new Set(fresh.map(h=>String(h&&h.ts))),addH=[];
    hrows.forEach(row=>{const d=row.data;if(!d||!d.ts||haveTs.has(String(d.ts)))return;haveTs.add(String(d.ts));
      const e={n:d.n,r:d.r,w:d.w,s:d.s,m:d.m,sc:d.sc,ts:d.ts};
      if(d.qi){e.qs=d.qi.map(id=>textOf[id]||null);e.p=d.p;e.t=d.t;e.rv=d.rv}
      addH.push(e)});
    if(addH.length){applying=true;try{rawSet.call(store,"jk_hist",fresh.concat(addH).sort((x,y)=>y.ts-x.ts))}finally{applying=false}changed=true}
    /* nayi shadow = server ki ab ki halat */
    const ns={};KN.forEach(k=>{const f=new Set(S[k]);up[k].forEach(id=>f.add(id));dl[k].forEach(id=>f.delete(id));ns[k]=Array.from(f)});
    const m2=meta();m2.uid=uid;m2.shadow=ns;m2.lastSync=Date.now();m2.pending=again;saveMeta(m2);
    if(changed){if(document.querySelector(".greet"))home();else if(document.getElementById("acct"))profile()}
  }
  async function run(){
    if(!window.JKAuth||!JKAuth.isLoggedIn())return;
    if(running){again=true;return}
    if(!navigator.onLine){setState("offline");return}
    running=true;clearTimeout(timer);setState("syncing");
    try{await doSync();retryN=0;setState("synced")}
    catch(e){
      try{console.warn("sync:",e&&e.message)}catch(_){}
      if(navigator.onLine){setState("failed");const d=[5,15,45,120,300];timer=setTimeout(run,d[Math.min(retryN++,4)]*1000)}else setState("offline");
    }
    running=false;
    if(again){again=false;clearTimeout(timer);timer=setTimeout(run,500)}
  }
  function touch(){
    if(!window.JKAuth||!JKAuth.isLoggedIn())return;
    const m=meta();m.pending=true;saveMeta(m);paint();clearTimeout(timer);timer=setTimeout(run,3000);
  }
  function setState(s){state=s;paint()}
  function fmt(t){try{return new Date(t).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"})}catch(e){return ""}}
  function paint(){
    const el=document.getElementById("syncChip");if(!el)return;
    const m=meta();let t,c;
    if(state==="syncing"){t="Syncing...";c="#1457d9"}
    else if(state==="offline"){t="Offline - net aane par sync hoga";c="#b26a00"}
    else if(state==="failed"){t="Sync Failed - tap karke dobara try karein";c="#c62828"}
    else{t=m.lastSync?"Synced - "+fmt(m.lastSync):(m.pending?"Sync baaki hai":"Sync ke liye taiyar");c="#16803a"}
    el.textContent=t;el.style.color=c;el.onclick=()=>{retryN=0;run()};
  }
  window.addEventListener("online",()=>{retryN=0;run()});
  window.addEventListener("offline",()=>setState("offline"));
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&meta().pending)run()});
  window.addEventListener("load",()=>setTimeout(run,1500));
  window.JKSync={run,touch,paint,state:()=>state,_doSync:doSync};
})();
</script>
<script>
/* Offline support: service worker (sirf secure https page par) */
if("serviceWorker" in navigator&&location.protocol==="https:"){
  window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})});
}
</script>
