<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAKHAR Sync Test</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e3e6ea;--pri:#2b5cff;--bad:#c62828;--ok:#2e7d32}
  @media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2125;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2c3238;--pri:#6c8cff;--bad:#ef6b6b;--ok:#6fcf74}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
  h1{font-size:20px;margin:6px 0 12px}
  input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin-bottom:10px}
  button{background:var(--pri);color:#fff;border:0;font-weight:600;cursor:pointer}
  button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
  .row{display:flex;gap:8px}.row button{margin-bottom:0}
  .hide{display:none}
  .log{font-size:13px;white-space:pre-wrap;word-break:break-word;min-height:60px}
  .bad{color:var(--bad)}.ok{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <h1>JAKHAR Sync Security Test</h1>

  <div id="authBox" class="card">
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password (8+ akshar)" autocomplete="current-password">
    <div class="row"><button id="loginBtn">Login</button><button id="signupBtn" class="sec">Signup</button></div>
    <div style="height:10px"></div>
    <button id="anonBtn" class="sec" style="margin-bottom:0">Bina login ke test (anon)</button>
  </div>

  <div id="home" class="hide">
    <div class="card">
      <div style="margin-bottom:10px">Login: <b id="who"></b></div>
      <button id="wBtn">1. Apni ek flag likho</button>
      <button id="rBtn" class="sec">2. Jitni flags dikhti hain gino</button>
      <button id="dBtn" class="sec">3. Meri flags hatao (safai)</button>
      <button id="lBtn" class="sec" style="margin-bottom:0">Logout</button>
    </div>
  </div>

  <div class="card"><div id="log" class="log">Yahan result dikhega.</div></div>
</div>

<script>
const SB_URL = "https://gpqrkxyypadgvguomfrr.supabase.co";
const SB_KEY = "sb_publishable_WIDLgN0x4IX2_LYy2WBWCA_3-zLJvrq"; // publishable key (public hai)
let TOKEN = null, USER = null;
const $ = id => document.getElementById(id);
function log(t, cls) { const l = $("log"); l.textContent = t; l.className = "log " + (cls || ""); }

async function api(path, opts = {}) {
  const r = await fetch(SB_URL + path, { ...opts, headers: { apikey: SB_KEY, Authorization: "Bearer " + (TOKEN || SB_KEY),
    "Content-Type": "application/json", ...(opts.headers || {}) } });
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) throw new Error((j && (j.msg || j.message || j.error_description || j.error)) || ("HTTP " + r.status));
  return j;
}
function creds() {
  const email = $("em").value.trim(), password = $("pw").value;
  if (!email || password.length < 8) { log("Email daalo aur password 8+ akshar ka rakho.", "bad"); return null; }
  return { email, password };
}
function enter(j) {
  TOKEN = j.access_token; USER = j.user; $("pw").value = "";
  $("authBox").classList.add("hide"); $("home").classList.remove("hide");
  $("who").textContent = USER.email; log("Login ho gaya.", "ok");
}
async function login() { const c = creds(); if (!c) return;
  try { enter(await api("/auth/v1/token?grant_type=password", { method: "POST", body: JSON.stringify(c) })); }
  catch (e) { log("Login fail: " + e.message, "bad"); } }
async function signup() { const c = creds(); if (!c) return;
  try { const j = await api("/auth/v1/signup", { method: "POST", body: JSON.stringify(c) });
    if (j && j.access_token) enter(j); else log("Signup hua, ab Login dabao.", "bad"); }
  catch (e) { log("Signup fail: " + e.message, "bad"); } }

async function writeFlag() {
  try {
    const q = await api("/rest/v1/questions?select=id&is_active=eq.true&order=created_at.asc&limit=1");
    await api("/rest/v1/user_flags", { method: "POST", headers: { Prefer: "resolution=ignore-duplicates" },
      body: JSON.stringify({ question_id: q[0].id, kind: "saved" }) });
    log("Flag likh di (1 sawal, kind=saved).", "ok");
  } catch (e) { log("Write fail: " + e.message, "bad"); }
}
async function readFlags() {
  try {
    const rows = await api("/rest/v1/user_flags?select=user_id,question_id,kind");
    const mine = rows.filter(r => r.user_id === USER.id).length;
    const others = rows.length - mine;
    log("Mujhe dikhne wali flags: " + rows.length + "\nMeri apni: " + mine + "\nDusron ki: " + others +
      (others === 0 ? "\n\nSAHI: dusre ka data nahi dikh raha." : "\n\nDIKKAT: dusron ka data dikh raha hai! Mujhe batao."), others === 0 ? "ok" : "bad");
  } catch (e) { log("Read fail: " + e.message, "bad"); }
}
async function delFlags() {
  try { await api("/rest/v1/user_flags?user_id=eq." + USER.id, { method: "DELETE" }); log("Meri flags hata di.", "ok"); }
  catch (e) { log("Delete fail: " + e.message, "bad"); }
}
async function anonTest() {
  const old = TOKEN; TOKEN = null; let out = "";
  try { const rows = await api("/rest/v1/user_flags?select=user_id"); out += "Anon READ: " + rows.length + " rows dikhi " + (rows.length === 0 ? "(sahi)" : "(DIKKAT!)") + "\n"; }
  catch (e) { out += "Anon READ roka gaya (sahi): " + e.message + "\n"; }
  try { await api("/rest/v1/user_flags", { method: "POST", body: JSON.stringify({ question_id: "00000000-0000-0000-0000-000000000000", kind: "saved" }) });
    out += "Anon WRITE ho gaya (DIKKAT!)"; }
  catch (e) { out += "Anon WRITE roka gaya (sahi): " + e.message; }
  TOKEN = old; log(out, out.includes("DIKKAT") ? "bad" : "ok");
}
function logout() { TOKEN = null; USER = null; $("home").classList.add("hide"); $("authBox").classList.remove("hide"); log("Logout ho gaya.", "ok"); }

$("loginBtn").onclick = login; $("signupBtn").onclick = signup;
$("wBtn").onclick = writeFlag; $("rBtn").onclick = readFlags; $("dBtn").onclick = delFlags;
$("lBtn").onclick = logout; $("anonBtn").onclick = anonTest;
</script>
</body>
</html>
