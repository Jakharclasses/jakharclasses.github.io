<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAKHAR Login Test</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e3e6ea;--pri:#2b5cff;--bad:#c62828;--ok:#2e7d32}
  @media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2125;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2c3238;--pri:#6c8cff;--bad:#ef6b6b;--ok:#6fcf74}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
  h1{font-size:20px;margin:6px 0 12px}
  input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin-bottom:10px}
  button{background:var(--pri);color:#fff;border:0;font-weight:600;cursor:pointer}
  button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
  .row{display:flex;gap:8px}.row button{margin-bottom:0}
  .msg{font-size:14px;min-height:20px;margin-top:8px;word-break:break-word}
  .bad{color:var(--bad)}.ok{color:var(--ok)}
  .hide{display:none}
  .line{padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>JAKHAR Student Login (Test)</h1>

  <div id="authBox" class="card">
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password (kam se kam 8 akshar)" autocomplete="current-password">
    <div class="row">
      <button id="loginBtn">Login</button>
      <button id="signupBtn" class="sec">Signup</button>
    </div>
    <div id="authMsg" class="msg"></div>
  </div>

  <div id="home" class="hide">
    <div class="card">
      <div class="line">Login: <b id="who"></b></div>
      <div class="line">Admin hai? <b id="isAdm">...</b></div>
      <div class="line">Dikhne wale sawal: <b id="cnt">...</b></div>
      <div style="margin-top:10px">
        <button id="writeBtn" class="sec">Write test (fail hona chahiye)</button>
        <button id="logoutBtn" class="sec" style="margin-bottom:0">Logout</button>
      </div>
      <div id="tMsg" class="msg"></div>
    </div>
  </div>
</div>

<script>
const SB_URL = "https://gpqrkxyypadgvguomfrr.supabase.co";
const SB_KEY = "sb_publishable_WIDLgN0x4IX2_LYy2WBWCA_3-zLJvrq"; // publishable key (public hai)
let TOKEN = null, USER = null;
const $ = id => document.getElementById(id);

async function api(path, opts = {}) {
  const r = await fetch(SB_URL + path, { ...opts, headers: { apikey: SB_KEY, Authorization: "Bearer " + (TOKEN || SB_KEY),
    "Content-Type": "application/json", ...(opts.headers || {}) } });
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) throw new Error((j && (j.msg || j.message || j.error_description || j.error)) || ("HTTP " + r.status));
  return { j, headers: r.headers };
}
function say(el, t, ok) { el.textContent = t; el.className = "msg " + (ok ? "ok" : "bad"); }

function creds() {
  const email = $("em").value.trim(), password = $("pw").value;
  if (!email || password.length < 8) { say($("authMsg"), "Email daalo aur password kam se kam 8 akshar ka rakho.", false); return null; }
  return { email, password };
}
async function enter(j) {
  TOKEN = j.access_token; USER = j.user; $("pw").value = "";
  $("authBox").classList.add("hide"); $("home").classList.remove("hide");
  $("who").textContent = USER.email; $("tMsg").textContent = "";
  try { const a = await api("/rest/v1/rpc/is_admin", { method: "POST", body: "{}" }); $("isAdm").textContent = a.j ? "HAAN (admin)" : "NAHI (student)"; }
  catch (e) { $("isAdm").textContent = "check fail: " + e.message; }
  try { const c = await api("/rest/v1/questions?select=id", { headers: { Prefer: "count=exact", Range: "0-0" } });
    $("cnt").textContent = (c.headers.get("content-range") || "").split("/")[1] || "?"; }
  catch (e) { $("cnt").textContent = "error: " + e.message; }
}
async function login() {
  const c = creds(); if (!c) return; say($("authMsg"), "Ruko...", true);
  try { const r = await api("/auth/v1/token?grant_type=password", { method: "POST", body: JSON.stringify(c) }); await enter(r.j); }
  catch (e) { say($("authMsg"), "Login fail: " + e.message, false); }
}
async function signup() {
  const c = creds(); if (!c) return; say($("authMsg"), "Ruko...", true);
  try {
    const r = await api("/auth/v1/signup", { method: "POST", body: JSON.stringify(c) });
    if (r.j && r.j.access_token) await enter(r.j);
    else say($("authMsg"), "Signup ho gaya, par seedha login nahi hua (shayad Confirm email ON hai ya email pehle se hai). Ab Login dabao.", false);
  } catch (e) { say($("authMsg"), "Signup fail: " + e.message, false); }
}
async function writeTest() {
  say($("tMsg"), "Ruko...", true);
  try {
    await api("/rest/v1/questions", { method: "POST", body: JSON.stringify({ subject: "x", chapter: "x", question: "STUDENT WRITE TEST " + Date.now(),
      options: ["a","b","c","d"], answer: 0, explanation: "x", exams: [], is_active: false }) });
    say($("tMsg"), "DIKKAT: student ne sawal likh diya! Turant mujhe batao.", false);
  } catch (e) { say($("tMsg"), "Sahi: write roka gaya -> " + e.message, true); }
}
function logout() { TOKEN = null; USER = null; $("home").classList.add("hide"); $("authBox").classList.remove("hide"); say($("authMsg"), "", true); }

$("loginBtn").onclick = login; $("signupBtn").onclick = signup;
$("writeBtn").onclick = writeTest; $("logoutBtn").onclick = logout;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
</script>
</body>
</html>
